…3 → y = 3, 0, −1, 0, 3, 8, 15；顶点 (−1, −1)", "yt": "corbettmaths drawing quadratic graphs", "bili": "二次函数图像 抛物线", "qs": [{"t": "计算题 Calculation", "qz": "y = x² + 2 中 x = −3 时 y = ?", "qe": "y = x² + 2: y when x = −3?", "a": "11"}, {"t": "选择题 MCQ", "qz": "y = −2x² + 3 的开口方向？ A. 向上 B. 向下", "qe": "Shape of y = −2x² + 3? A. U B. inverted U", "a": "B. 向下"}, {"t": "计算题 Calculation", "qz": "y = x² − 4x + 1 的对称轴？", "qe": "Line of symmetry of y = x² − 4x + 1?", "a": "x = 2"}, {"t": "判断题 True/False", "qz": "画二次函数图时，点之间用直线连接。", "qe": "Join the points of a quadratic graph with straight lines.", "a": "错误 False"}]}, {"id": "u4g2", "zh": "用图像解 ax² + bx + c = 0", "en": "Solving 0 = ax² + bx + c graphically", "page": 265, "ez": "方程 ax² + bx + c = 0 的解就是抛物线 y = ax² + bx + c 与 x 轴（y = 0）交点的横坐标。可能有 2 个、1 个或 0 个实数解。解 ax² + bx + c = k 时看与直线 y = k 的交点。图像法得到的是近似解。", "ee": "The solutions of ax² + bx + c = 0 are the x-coordinates where the curve meets the x-axis (y = 0). There may be 2, 1 or 0 real solutions. To solve ax² + bx + c = k, read where the curve meets y = k. Graphical solutions are approximate.", "terms": ["root / solution 根/解", "x-axis x轴", "intersection 交点"], "ex": "y = x² − x − 6 与 x 轴交于 x = −2 和 x = 3", "yt": "solving quadratics graphically gcse", "bili": "图像法解一元二次方程", "qs": [{"t": "计算题 Calculation", "qz": "y = x² − 4 与 x 轴交点？", "qe": "Where does y = x² − 4 meet the x-axis?", "a": "x = ±2"}, {"t": "选择题 MCQ", "qz": "y = x² + 1 与 x 轴有几个交点？ A. 0 B. 1 C. 2", "qe": "How many times does y = x² + 1 meet the x-axis? A. 0 B. 1 C. 2", "a": "A. 0"}, {"t": "计算题 Calculation", "qz": "用 y = x² − 2x 的图解 x² − 2x = 3。", "qe": "Use y = x² − 2x to solve x² − 2x = 3.", "a": "与 y = 3 交于 x = −1, 3"}, {"t": "判断题 True/False", "qz": "y = (x − 3)² 与 x 轴只有一个交点。", "qe": "y = (x − 3)² touches the x-axis once.", "a": "正确 True"}]}]}, {"id": "u4s", "unit": "第4单元 Unit 4", "zh": "形与空间 4", "en": "Shape and Space 4", "page": 271, "kps": [{"id": "u4s1", "zh": "正弦与余弦比", "en": "Sine & cosine ratios", "page": 271, "ez": "sin θ = 对边/斜边（SOH），cos θ = 邻边/斜边（CAH），tan θ = 对边/邻边（TOA）。口诀 SOH-CAH-TOA。sin、cos 值都在 0 到 1 之间（锐角）。", "ee": "sin θ = opposite/hypotenuse (SOH), cos θ = adjacent/hypotenuse (CAH), tan θ = opposite/adjacent (TOA). Remember SOH-CAH-TOA. For acute angles sin and cos lie between 0 and 1.", "terms": ["sine 正弦", "cosine 余弦", "SOH-CAH-TOA 口诀"], "ex": "3-4-5 三角形：sin θ = 3/5，cos θ = 4/5，tan θ = 3/4", "yt": "corbettmaths sine cosine SOHCAHTOA", "bili": "正弦 余弦 SOHCAHTOA", "qs": [{"t": "填空题 Fill in", "qz": "cos θ = ____ / ____", "qe": "cos θ = ____ / ____", "a": "邻边 adj / 斜边 hyp"}, {"t": "计算题 Calculation", "qz": "对边 5，斜边 13，sin θ = ?", "qe": "Opposite 5, hypotenuse 13. sin θ?", "a": "5/13"}, {"t": "判断题 True/False", "qz": "锐角的 sin 值可能大于 1。", "qe": "sin of an acute angle can exceed 1.", "a": "错误 False"}, {"t": "选择题 MCQ", "qz": "已知邻边与斜边，用？ A. sin B. cos C. tan", "qe": "Given adjacent and hypotenuse, use: A. sin B. cos C. tan", "a": "B. cos"}]}, {"id": "u4s2", "zh": "用 sin/cos 求边", "en": "Calculating sides with sin & cos", "page": 273, "ez": "标出已知边和所求边，选含这两边的比：opp = hyp × sin θ；adj = hyp × cos θ；若所求在分母，如 hyp = opp ÷ sin θ 或 hyp = adj ÷ cos θ。", "ee": "Mark the side you know and the side you want; choose the ratio containing both. opp = hyp × sin θ; adj = hyp × cos θ; if the unknown is the hypotenuse, hyp = opp ÷ sin θ or adj ÷ cos θ.", "terms": ["kite string 风筝线", "angle of elevation 仰角"], "ex": "风筝线 10 m，仰角 32°：高 = 10 sin 32° ≈ 5.30 m；邻边 75，角 43°：斜边 = 75/cos 43° ≈ 103", "yt": "corbettmaths trigonometry missing sides sin cos", "bili": "三角函数求边 sin cos", "qs": [{"t": "计算题 Calculation", "qz": "斜边 35，θ = 26°，求邻边。", "qe": "Hypotenuse 35, θ = 26°. Adjacent?", "a": "35 cos 26° ≈ 31.5"}, {"t": "计算题 Calculation", "qz": "斜边 12，θ = 40°，求对边。", "qe": "Hypotenuse 12, θ = 40°. Opposite?", "a": "12 sin 40° ≈ 7.71"}, {"t": "计算题 Calculation", "qz": "对边 6，θ = 30°，求斜边。", "qe": "Opposite 6, θ = 30°. Hypotenuse?", "a": "6 ÷ 0.5 = 12"}, {"t": "应用题 Word problem", "qz": "8 m 梯子与地面成 70°，顶部多高？", "qe": "An 8 m ladder makes 70° with the ground. Height reached?", "a": "8 sin 70° ≈ 7.52 m"}]}, {"id": "u4s3", "zh": "用 sin/cos 求角", "en": "Calculating angles with sin & cos", "page": 275, "ez": "标出已知的两边，选含这两边的比，再用 sin⁻¹、cos⁻¹ 或 tan⁻¹ 求角（计算器在度模式）。", "ee": "Mark the two given sides, choose the matching ratio, then use sin⁻¹, cos⁻¹ or tan⁻¹ (calculator in degree mode).", "terms": ["inverse sine sin⁻¹", "inverse cosine cos⁻¹"], "ex": "opp 2.8，hyp 8.4：θ = sin⁻¹(1/3) ≈ 19.5°", "yt": "corbettmaths trigonometry missing angles sin cos", "bili": "反正弦 反余弦 求角", "qs": [{"t": "计算题 Calculation", "qz": "adj 9，hyp 18，θ = ?", "qe": "adj 9, hyp 18. θ?", "a": "cos⁻¹(0.5) = 60°"}, {"t": "计算题 Calculation", "qz": "opp 3.7，hyp 11.5，θ = ?", "qe": "opp 3.7, hyp 11.5. θ?", "a": "sin⁻¹(0.3217) ≈ 18.8°"}, {"t": "应用题 Word problem", "qz": "10 m 绳子拉到高 6 m 的杆顶，绳与地面夹角？", "qe": "A 10 m rope reaches the top of a 6 m pole. Angle with the ground?", "a": "sin⁻¹(0.6) ≈ 36.9°"}, {"t": "判断题 True/False", "qz": "cos⁻¹(1) = 0°。", "qe": "cos⁻¹(1) = 0°.", "a": "正确 True"}]}, {"id": "u4s4", "zh": "三角函数综合题（仰角、俯角、方位）", "en": "Mixed trigonometry problems", "page": 278, "ez": "综合题需判断用勾股定理还是三角比：已知两边求第三边用勾股；涉及角用三角比。仰角从水平线向上测，俯角从水平线向下测；俯角等于对应的仰角（内错角）。复杂图形拆成直角三角形，可结合方位角。", "ee": "Decide whether to use Pythagoras (two sides → third side) or trigonometry (angles involved). Angles of elevation are measured up from the horizontal, depression down; they are equal as alternate angles. Split complex shapes into right-angled triangles; combine with bearings.", "terms": ["angle of depression 俯角", "angle of elevation 仰角", "exact value 精确值"], "ex": "悬崖高 50 m，看船的俯角 20°：距离 = 50/tan 20° ≈ 137 m", "yt": "corbettmaths angles of elevation and depression", "bili": "仰角 俯角 解直角三角形", "qs": [{"t": "应用题 Word problem", "qz": "从 30 m 高塔看地面车的俯角 25°，车离塔底多远？", "qe": "From a 30 m tower the angle of depression of a car is 25°. Distance from the base?", "a": "30/tan 25° ≈ 64.3 m"}, {"t": "应用题 Word problem", "qz": "船向东 5 km 再向北 12 km，离起点多远？", "qe": "A ship sails 5 km east then 12 km north. Distance from start?", "a": "13 km"}, {"t": "计算题 Calculation", "qz": "上题中起点看船的方位角？", "qe": "Bearing of the ship from the start?", "a": "tan⁻¹(5/12) ≈ 022.6°"}, {"t": "判断题 True/False", "qz": "俯角与对应的仰角相等。", "qe": "An angle of depression equals the corresponding angle of elevation.", "a": "正确 True"}]}]}, {"id": "u4h", "unit": "第4单元 Unit 4", "zh": "数据处理 3", "en": "Handling Data 3", "page": 285, "kps": [{"id": "u4h1", "zh": "离散程度的度量（极差）", "en": "Measures of dispersion", "page": 286, "ez": "离散程度描述数据的分散情况。极差 = 最大值 − 最小值，易受极端值影响。比较两组数据时，应同时比较平均（集中趋势）和离散程度。", "ee": "Dispersion measures how spread out data is. Range = highest − lowest, which is affected by extreme values. When comparing data sets, compare both an average and a measure of spread.", "terms": ["dispersion / spread 离散程度", "range 极差", "consistent 稳定"], "ex": "A 组 5, 6, 7（极差 2）比 B 组 1, 6, 11（极差 10）更稳定", "yt": "corbettmaths range comparing distributions", "bili": "极差 离散程度 比较数据", "qs": [{"t": "计算题 Calculation", "qz": "求 12, 7, 19, 4, 15 的极差。", "qe": "Range of 12, 7, 19, 4, 15.", "a": "15"}, {"t": "判断题 True/False", "qz": "极差小说明数据更稳定（更集中）。", "qe": "A smaller range means more consistent data.", "a": "正确 True"}, {"t": "应用题 Word problem", "qz": "两名运动员平均分相同，A 极差 3，B 极差 9，谁更稳定？", "qe": "Two athletes have equal means; A range 3, B range 9. Who is more consistent?", "a": "A"}, {"t": "选择题 MCQ", "qz": "极差的缺点： A. 难计算 B. 受极端值影响 C. 不能用于数字", "qe": "A drawback of the range: A. hard to calculate B. affected by extremes C. not numerical", "a": "B"}]}, {"id": "u4h2", "zh": "四分位数与四分位距", "en": "Quartiles & inter-quartile range", "page": 286, "ez": "数据从小到大排列：下四分位数 Q₁ = 第 ¼(n + 1) 个；中位数 Q₂ = 第 ½(n + 1) 个；上四分位数 Q₃ = 第 ¾(n + 1) 个。四分位距 IQR = Q₃ − Q₁，是中间 50% 数据的范围，不受极端值影响。位置在两数之间时取两数平均。", "ee": "With data in order: lower quartile Q₁ = ¼(n + 1)th value; median Q₂ = ½(n + 1)th; upper quartile Q₃ = ¾(n + 1)th. Inter-quartile range IQR = Q₃ − Q₁ is the range of the middle 50% and is not affected by extremes. If the position falls between two values use their mean.", "terms": ["quartile 四分位数", "lower quartile 下四分位数", "upper quartile 上四分位数", "IQR 四分位距", "percentile 百分位数"], "ex": "$4, 6, 6, 7, 10, 12, 15：Q₁ = 6，中位数 7，Q₃ = 12，IQR = 6", "yt": "corbettmaths quartiles interquartile range", "bili": "四分位数 四分位距", "qs": [{"t": "计算题 Calculation", "qz": "3, 5, 8, 9, 11, 14, 20 的 Q₁、Q₃、IQR。", "qe": "Q₁, Q₃, IQR of 3, 5, 8, 9, 11, 14, 20.", "a": "Q₁ = 5，Q₃ = 14，IQR = 9"}, {"t": "计算题 Calculation", "qz": "11 个数据的 Q₃ 是第几个？", "qe": "For 11 values, Q₃ is which value?", "a": "第 9 个"}, {"t": "判断题 True/False", "qz": "IQR 受极端值影响较大。", "qe": "The IQR is strongly affected by extreme values.", "a": "错误 False"}, {"t": "填空题 Fill in", "qz": "Q₂ 也叫 ____。", "qe": "Q₂ is also called the ____.", "a": "中位数 median"}]}, {"id": "u4h3", "zh": "累积频数图", "en": "Cumulative frequency", "page": 290, "ez": "累积频数是逐组累加的频数。在各组的上限处描点（上限, 累积频数），用光滑曲线（或折线）连接成 S 形曲线。对 n 个数据，估计：中位数为第 n/2 个，Q₁ 为第 n/4 个，Q₃ 为第 3n/4 个；也可读出超过某值的个数或百分比。", "ee": "Cumulative frequency is the running total of frequencies. Plot (upper class boundary, cumulative frequency) and join with a smooth S-shaped curve. For n values estimate: median = n/2th, Q₁ = n/4th, Q₃ = 3n/4th; you can also read how many are above/below a value.", "terms": ["cumulative frequency 累积频数", "upper class boundary 组上限", "ogive / S-curve S形曲线"], "ex": "120 人完成拼图时间：中位数读第 60 个，Q₁ 第 30 个，Q₃ 第 90 个", "yt": "corbettmaths cumulative frequency", "bili": "累积频数图 中位数 四分位数", "qs": [{"t": "计算题 Calculation", "qz": "频数 5, 12, 18, 10, 5，写出累积频数。", "qe": "Frequencies 5, 12, 18, 10, 5. Cumulative frequencies?", "a": "5, 17, 35, 45, 50"}, {"t": "填空题 Fill in", "qz": "80 株植物，Q₃ 在累积频数图上读第 ____ 个。", "qe": "For 80 plants, Q₃ is read at cumulative frequency ____.", "a": "60"}, {"t": "应用题 Word problem", "qz": "80 株中 64 株矮于 45 cm，高于 45 cm 的百分比？", "qe": "64 of 80 plants are under 45 cm. Percentage taller than 45 cm?", "a": "16/80 = 20%"}, {"t": "选择题 MCQ", "qz": "累积频数点应画在： A. 组中值 B. 组上限 C. 组下限", "qe": "Cumulative frequency is plotted at the: A. mid-point B. upper boundary C. lower boundary", "a": "B"}]}]}, {"id": "u5n", "unit": "第5单元 Unit 5", "zh": "数 5", "en": "Number 5", "page": 299, "kps": [{"id": "u5n1", "zh": "计算器的使用", "en": "Using a calculator", "page": 299, "ez": "熟悉计算器功能：乘方 xʸ / x²、开方 √、分数键 a b/c、科学记数法 ×10ˣ（EXP）、括号。复杂分式要给分子、分母分别加括号或用分数模板。先写出完整显示结果，再四舍五入。", "ee": "Know your calculator: powers xʸ / x², roots √, fraction key a b/c, standard form ×10ˣ (EXP), brackets. Put brackets around whole numerators/denominators or use the fraction template. Write the full display before rounding.", "terms": ["calculator 计算器", "EXP / ×10ˣ 科学记数键", "display 显示"], "ex": "6⁷ = 279 936；2.5 × 10⁻³ 输入 2.5 ×10ˣ (−) 3", "yt": "how to use scientific calculator gcse casio", "bili": "科学计算器 使用方法", "qs": [{"t": "计算题 Calculation", "qz": "计算 √(12.5² − 2.5²)（3 s.f.）。", "qe": "Work out √(12.5² − 2.5²) to 3 s.f.", "a": "√150 ≈ 12.2"}, {"t": "计算题 Calculation", "qz": "计算 7.75⁴ ÷ (11.3 + 27.7)（3 s.f.）。", "qe": "Work out 7.75⁴ ÷ (11.3 + 27.7) to 3 s.f.", "a": "3607.5/39 ≈ 92.5"}, {"t": "判断题 True/False", "qz": "计算 (3 + 5)/2 时直接输入 3 + 5 ÷ 2 即可。", "qe": "For (3 + 5)/2 you can just type 3 + 5 ÷ 2.", "a": "错误 False（得 5.5）"}, {"t": "计算题 Calculation", "qz": "计算 (3 × 10⁵)²。", "qe": "Work out (3 × 10⁵)².", "a": "9 × 10¹⁰"}]}, {"id": "u5n2", "zh": "估算", "en": "Estimating", "page": 301, "ez": "把每个数四舍五入到 1 位有效数字，再心算得到估计值，用来检查计算器答案是否合理。科学记数法估算：分别处理系数与 10 的幂。", "ee": "Round every number to 1 significant figure and work out mentally to get an estimate; use it to check calculator answers. With standard form, estimate the number parts and powers of 10 separately.", "terms": ["estimate 估算", "approximately ≈ 约等于", "1 s.f. 一位有效数字"], "ex": "(48.7 × 3.1)/0.52 ≈ (50 × 3)/0.5 = 300", "yt": "corbettmaths estimation", "bili": "估算 近似计算", "qs": [{"t": "计算题 Calculation", "qz": "估算 (19.8 × 4.1)/2.03。", "qe": "Estimate (19.8 × 4.1)/2.03.", "a": "(20 × 4)/2 = 40"}, {"t": "计算题 Calculation", "qz": "估算 √(98.6) × 3.04。", "qe": "Estimate √98.6 × 3.04.", "a": "10 × 3 = 30"}, {"t": "计算题 Calculation", "qz": "估算 (6.1 × 10⁴) × (2.9 × 10³)。", "qe": "Estimate (6.1 × 10⁴) × (2.9 × 10³).", "a": "≈ 6 × 3 × 10⁷ = 1.8 × 10⁸"}, {"t": "判断题 True/False", "qz": "估算时把数取到 1 位有效数字。", "qe": "When estimating, round to 1 s.f.", "a": "正确 True"}]}, {"id": "u5n3", "zh": "取整与上下界", "en": "Rounding, upper & lower bounds", "page": 304, "ez": "按某单位取整的测量值，真实值可能比它小或大半个单位。x = 7（取整到个位）⇒ 6.5 ≤ x < 7.5。上界 = 测量值 + 半个单位，下界 = 测量值 − 半个单位。计算：和的最大值 = 上界 + 上界；差的最大值 = 上界 − 下界；商的最大值 = 上界 ÷ 下界。", "ee": "A measurement rounded to the nearest unit can be up to half a unit smaller or larger. x = 7 (nearest integer) ⇒ 6.5 ≤ x < 7.5. Upper bound = value + half a unit, lower bound = value − half a unit. Max sum = UB + UB; max difference = UB − LB; max quotient = UB ÷ LB.", "terms": ["upper bound 上界", "lower bound 下界", "error interval 误差区间", "nearest 精确到"], "ex": "y = 7.5 (1 d.p.) ⇒ 7.45 ≤ y < 7.55；z = 20（精确到 10）⇒ 15 ≤ z < 25", "yt": "corbettmaths upper and lower bounds", "bili": "上界 下界 误差区间", "qs": [{"t": "计算题 Calculation", "qz": "长度 12 cm（精确到 cm）的上下界？", "qe": "Bounds of 12 cm (nearest cm)?", "a": "11.5 ≤ l < 12.5"}, {"t": "计算题 Calculation", "qz": "人口 350 000 和 314 000（精确到千），人口差的最大值？", "qe": "Populations 350 000 and 314 000 (nearest thousand). Maximum difference?", "a": "350 500 − 313 500 = 37 000"}, {"t": "计算题 Calculation", "qz": "长方形 8 cm × 5 cm（精确到 cm），面积下界？", "qe": "Rectangle 8 cm × 5 cm (nearest cm). Lower bound of area?", "a": "7.5 × 4.5 = 33.75 cm²"}, {"t": "选择题 MCQ", "qz": "速度 = 距离/时间，求速度上界用： A. 上界/上界 B. 上界/下界 C. 下界/上界", "qe": "Upper bound of speed = distance/time uses: A. UB/UB B. UB/LB C. LB/UB", "a": "B"}]}]}, {"id": "u5a", "unit": "第5单元 Unit 5", "zh": "代数 5", "en": "Algebra 5", "page": 311, "kps": [{"id": "u5a1", "zh": "乘开括号（FOIL）", "en": "Multiplying brackets (FOIL)", "page": 311, "ez": "两个一次括号相乘用 FOIL：First 首项、Outside 外项、Inside 内项、Last 末项，再合并同类项：(a + b)(c + d) = ac + ad + bc + bd。(x + a)² = x² + 2ax + a²（不是 x² + a²）。三个括号：先乘两个，再乘第三个。", "ee": "Multiply two linear brackets with FOIL: First, Outside, Inside, Last, then add: (a + b)(c + d) = ac + ad + bc + bd. (x + a)² = x² + 2ax + a² (not x² + a²). For three brackets, multiply two first, then the third.", "terms": ["FOIL 首外内末", "expand 展开", "linear 一次", "perfect square 完全平方"], "ex": "(x + 4)(x + 1) = x² + 5x + 4；(x − 4)² = x² − 8x + 16", "yt": "corbettmaths expanding double brackets", "bili": "多项式乘法 展开双括号", "qs": [{"t": "计算题 Calculation", "qz": "展开 (x − 7)(x + 3)。", "qe": "Expand (x − 7)(x + 3).", "a": "x² − 4x − 21"}, {"t": "计算题 Calculation", "qz": "展开 (3x − 2)(5x + 1)。", "qe": "Expand (3x − 2)(5x + 1).", "a": "15x² − 7x − 2"}, {"t": "计算题 Calculation", "qz": "展开 (x + 5)(x − 5)。", "qe": "Expand (x + 5)(x − 5).", "a": "x² − 25"}, {"t": "判断题 True/False", "qz": "(x + 3)² = x² + 9。", "qe": "(x + 3)² = x² + 9.", "a": "错误 False，= x² + 6x + 9"}]}, {"id": "u5a2", "zh": "因式分解二次式", "en": "Factorising quadratic expressions", "page": 316, "ez": "两项：x² + ax = x(x + a)；平方差 x² − a² = (x + a)(x − a)；x² + a² 不能分解。三项 x² + bx + c：找两个数，积为 c、和为 b。a ≠ 1 时（如 2x² + 7x + 3）可用试算或拆项法。分解后展开检查。", "ee": "Two terms: x² + ax = x(x + a); difference of two squares x² − a² = (x + a)(x − a); x² + a² cannot be factorised. Three terms x² + bx + c: find two numbers with product c and sum b. When a ≠ 1 (e.g. 2x² + 7x + 3) use trial or splitting the middle term. Check by expanding.", "terms": ["difference of two squares 平方差", "trinomial 三项式", "product 积", "sum 和"], "ex": "x² − 3x − 10 = (x + 2)(x − 5)；2x² + 7x + 3 = (2x + 1)(x + 3)", "yt": "corbettmaths factorising quadratics", "bili": "因式分解 十字相乘 平方差", "qs": [{"t": "计算题 Calculation", "qz": "分解 x² − 49。", "qe": "Factorise x² − 49.", "a": "(x + 7)(x − 7)"}, {"t": "计算题 Calculation", "qz": "分解 x² + 7x + 12。", "qe": "Factorise x² + 7x + 12.", "a": "(x + 3)(x + 4)"}, {"t": "计算题 Calculation", "qz": "分解 x² − 2x − 15。", "qe": "Factorise x² − 2x − 15.", "a": "(x − 5)(x + 3)"}, {"t": "计算题 Calculation", "qz": "分解 4x² − 16。", "qe": "Factorise 4x² − 16.", "a": "4(x + 2)(x − 2)"}]}, {"id": "u5a3", "zh": "因式分解法解一元二次方程", "en": "Solving quadratic equations by factorisation", "page": 319, "ez": "先整理成 ax² + bx + c = 0 的形式，因式分解，再利用“若 AB = 0，则 A = 0 或 B = 0”求出两个解。不要两边同除以 x（会丢失 x = 0 的解）。", "ee": "Rearrange to ax² + bx + c = 0, factorise, then use 'if AB = 0 then A = 0 or B = 0' to get the solutions. Never divide both sides by x (you lose x = 0).", "terms": ["quadratic equation 一元二次方程", "root 根", "zero product 零积"], "ex": "x² − x − 6 = 0 ⇒ (x − 3)(x + 2) = 0 ⇒ x = 3 或 −2", "yt": "corbettmaths solving quadratics by factorising", "bili": "因式分解法 解一元二次方程", "qs": [{"t": "计算题 Calculation", "qz": "解 x² − 5x = 0。", "qe": "Solve x² − 5x = 0.", "a": "x = 0 或 5"}, {"t": "计算题 Calculation", "qz": "解 x² + 2x − 8 = 0。", "qe": "Solve x² + 2x − 8 = 0.", "a": "x = 2 或 −4"}, {"t": "计算题 Calculation", "qz": "解 x² = 3x + 10。", "qe": "Solve x² = 3x + 10.", "a": "x = 5 或 −2"}, {"t": "判断题 True/False", "qz": "x² = 4x 的解只有 x = 4。", "qe": "x² = 4x has only the solution x = 4.", "a": "错误 False（还有 x = 0）"}]}, {"id": "u5a4", "zh": "列二次方程解应用题", "en": "Problems leading to quadratic equations", "page": 321, "ez": "如有需要画图并标注信息；用 x 表示一个未知量，其他量用 x 表示；列方程；求解。若 x 表示长度等，不能取负值。", "ee": "Draw a diagram if relevant; let x be one unknown and express others in terms of x; form an equation; solve. If x is a length it cannot be negative.", "terms": ["form an equation 列方程", "reject 舍去"], "ex": "x + x² = 12 ⇒ x² + x − 12 = 0 ⇒ x = 3 或 −4", "yt": "corbettmaths quadratic equations word problems", "bili": "一元二次方程 应用题", "qs": [{"t": "应用题 Word problem", "qz": "x 的平方减 x 得 20，求 x。", "qe": "When x is subtracted from its square, the answer is 20. Find x.", "a": "x = 5 或 −4"}, {"t": "应用题 Word problem", "qz": "长方形长比宽多 3 cm，面积 40 cm²，求宽。", "qe": "A rectangle is 3 cm longer than it is wide; area 40 cm². Width?", "a": "x(x + 3) = 40 ⇒ x = 5 cm"}, {"t": "应用题 Word problem", "qz": "两个连续正整数之积为 132，求它们。", "qe": "Two consecutive positive integers multiply to 132. Find them.", "a": "11 和 12"}, {"t": "应用题 Word problem", "qz": "Simone 把一个数平方再加原数的 2 倍得 24，求该数。", "qe": "Simone squares a number and adds twice the number to get 24. Find it.", "a": "x = 4 或 −6"}]}]}, {"id": "u5g", "unit": "第5单元 Unit 5", "zh": "图像 5", "en": "Graphs 5", "page": 326, "kps": [{"id": "u5g1", "zh": "用图像表示不等式", "en": "Representing inequalities graphically", "page": 326, "ez": "先画出等式对应的直线：包含边界（≤、≥）画实线，不包含（<、>）画虚线。用不在线上的点（常用原点）代入检验，确定所需区域。多个不等式时，所需区域是共同满足的部分（通常把不需要的区域涂阴影）。", "ee": "Draw the line for the equality: solid if points on the line are included (≤, ≥), dashed if not (<, >). Test any point not on the line (often the origin) to find the required region. For several inequalities the region satisfies all (often shade the unwanted regions).", "terms": ["region 区域", "solid line 实线", "dashed line 虚线", "shade 阴影"], "ex": "y < 6 − 2x：画虚线 y = 6 − 2x，(0, 0) 满足 0 < 6，取含原点一侧", "yt": "corbettmaths inequalities on a graph regions", "bili": "线性规划 不等式区域", "qs": [{"t": "选择题 MCQ", "qz": "表示 3x + 4y > 12 的边界用？ A. 实线 B. 虚线", "qe": "Boundary for 3x + 4y > 12: A. solid B. dashed", "a": "B. 虚线"}, {"t": "判断题 True/False", "qz": "点 (1, 1) 在 y ≥ 8 − x 的区域内。", "qe": "(1, 1) lies in the region y ≥ 8 − x.", "a": "错误 False（1 < 7）"}, {"t": "填空题 Fill in", "qz": "x ≤ −5 的区域在直线 x = −5 的 ____ 侧。", "qe": "x ≤ −5 is to the ____ of x = −5.", "a": "左 left"}, {"t": "计算题 Calculation", "qz": "写出满足 x ≥ 0，y ≥ 0，x + y ≤ 2 的所有整数点。", "qe": "List the integer points with x ≥ 0, y ≥ 0, x + y ≤ 2.", "a": "(0,0),(1,0),(2,0),(0,1),(1,1),(0,2)"}]}, {"id": "u5g2", "zh": "垂直直线", "en": "Perpendicular lines", "page": 329, "ez": "两直线垂直 ⇔ 斜率之积 m₁ × m₂ = −1，即 m₂ = −1/m₁（负倒数）。m₁ = m₂ 则平行。可用于求过某点且垂直于已知直线的方程。", "ee": "Two lines are perpendicular if m₁ × m₂ = −1, so m₂ = −1/m₁ (negative reciprocal). If m₁ = m₂ the lines are parallel. Use this to find the equation of a perpendicular line through a point.", "terms": ["perpendicular 垂直", "negative reciprocal 负倒数"], "ex": "斜率 −2 的垂线斜率 = ½；斜率 ⅓ 的垂线斜率 = −3", "yt": "corbettmaths perpendicular lines gradient", "bili": "两直线垂直 斜率乘积为 -1", "qs": [{"t": "计算题 Calculation", "qz": "垂直于 y = 4x − 1 的直线斜率？", "qe": "Gradient perpendicular to y = 4x − 1?", "a": "−1/4"}, {"t": "计算题 Calculation", "qz": "过 (2, 5) 且垂直于 y = 2x + 3 的直线方程？", "qe": "Line through (2, 5) perpendicular to y = 2x + 3?", "a": "y = −½x + 6"}, {"t": "判断题 True/False", "qz": "y = 3x 与 y = −⅓x + 2 垂直。", "qe": "y = 3x and y = −⅓x + 2 are perpendicular.", "a": "正确 True"}, {"t": "计算题 Calculation", "qz": "A(−2, 5)、B(−1, 1) 与 P(1, 3)、Q(5, 4) 的连线是否垂直？", "qe": "Are AB (A(−2,5), B(−1,1)) and PQ (P(1,3), Q(5,4)) perpendicular?", "a": "m = −4 与 ¼，积为 −1，垂直"}]}, {"id": "u5g3", "zh": "中点与垂直平分线", "en": "Mid-points & perpendicular bisectors", "page": 333, "ez": "(x₁, y₁) 与 (x₂, y₂) 的中点为 ((x₁ + x₂)/2, (y₁ + y₂)/2)，即坐标的平均。线段的垂直平分线：过中点，斜率为原线段斜率的负倒数。用草图检查。", "ee": "The mid-point of (x₁, y₁) and (x₂, y₂) is ((x₁ + x₂)/2, (y₁ + y₂)/2) – the mean of the coordinates. The perpendicular bisector passes through the mid-point with gradient the negative reciprocal of the segment's. Check with a sketch.", "terms": ["mid-point 中点", "perpendicular bisector 垂直平分线"], "ex": "中点 (2, 1)，AB 斜率 −2 ⇒ 垂直平分线 y = ½x", "yt": "corbettmaths midpoint of a line segment", "bili": "中点坐标公式 垂直平分线方程", "qs": [{"t": "计算题 Calculation", "qz": "A(2, 5)、B(10, 7) 的中点？", "qe": "Mid-point of A(2, 5) and B(10, 7).", "a": "(6, 6)"}, {"t": "计算题 Calculation", "qz": "A(−3, −4)、B(5, −2) 的中点？", "qe": "Mid-point of A(−3, −4) and B(5, −2).", "a": "(1, −3)"}, {"t": "计算题 Calculation", "qz": "A(4, 1)、B(−2, −1) 的垂直平分线方程？", "qe": "Perpendicular bisector of A(4, 1), B(−2, −1).", "a": "中点 (1, 0)，斜率 −3：y = −3x + 3"}, {"t": "填空题 Fill in", "qz": "中点的 x 坐标是两端点 x 坐标的 ____。", "qe": "The mid-point's x-coordinate is the ____ of the end x-coordinates.", "a": "平均数 mean"}]}, {"id": "u5g4", "zh": "用勾股定理求两点距离", "en": "Distance between two points (Pythagoras)", "page": 333, "ez": "两点间距离 d = √((x₂ − x₁)² + (y₂ − y₁)²)，就是以水平差和竖直差为直角边的直角三角形的斜边。可用于证明图形是正方形、等腰三角形等。", "ee": "Distance d = √((x₂ − x₁)² + (y₂ − y₁)²): the hypotenuse of a right-angled triangle whose legs are the horizontal and vertical differences. Use it to prove shapes are squares, isosceles triangles, etc.", "terms": ["distance formula 距离公式", "coordinate 坐标"], "ex": "(1, 2) 到 (4, 6)：√(9 + 16) = 5", "yt": "corbettmaths distance between two points pythagoras", "bili": "两点间距离公式 勾股", "qs": [{"t": "计算题 Calculation", "qz": "A(8, 1)、B(2, 6) 的距离（3 s.f.）。", "qe": "Distance A(8, 1) to B(2, 6) (3 s.f.).", "a": "√61 ≈ 7.81"}, {"t": "计算题 Calculation", "qz": "A(−5, 1)、B(−3, −4) 的距离。", "qe": "Distance A(−5, 1) to B(−3, −4).", "a": "√29 ≈ 5.39"}, {"t": "应用题 Word problem", "qz": "证明 A(−1,1)、B(11,6)、C(6,18)、D(−6,13) 四边相等。", "qe": "Show A(−1,1), B(11,6), C(6,18), D(−6,13) have four equal sides.", "a": "每边 √(144 + 25) = 13（再加对角线相等或垂直即为正方形）"}, {"t": "判断题 True/False", "qz": "(0,0) 到 (3,4) 的距离为 7。", "qe": "Distance (0,0) to (3,4) is 7.", "a": "错误 False（5）"}]}]}, {"id": "u5s", "unit": "第5单元 Unit 5", "zh": "形与空间 5", "en": "Shape and Space 5", "page": 338, "kps": [{"id": "u5s0", "zh": "图形变换概述", "en": "Transformations overview", "page": 338, "ez": "变换把原图（object）变为像（image）。四种基本变换：平移、反射、旋转（像与原图全等）和放大（像与原图相似）。描述变换时要说明变换类型及全部所需信息。", "ee": "A transformation maps an object onto an image. The four are translation, reflection, rotation (image congruent) and enlargement (image similar). When describing one, name it and give all the required details.", "terms": ["object 原图", "image 像", "congruent 全等", "similar 相似", "transformation 变换"], "ex": "平移/反射/旋转后形状大小不变；放大后形状不变、大小改变", "yt": "corbettmaths transformations describing", "bili": "图形变换 平移 旋转 对称", "qs": [{"t": "选择题 MCQ", "qz": "哪种变换会改变大小？ A. 平移 B. 旋转 C. 放大 D. 反射", "qe": "Which transformation changes size? A. translation B. rotation C. enlargement D. reflection", "a": "C"}, {"t": "判断题 True/False", "qz": "反射后的像与原图全等。", "qe": "A reflected image is congruent to the object.", "a": "正确 True"}, {"t": "填空题 Fill in", "qz": "变换前的图形叫 ____，变换后叫 ____。", "qe": "The shape before is the ____, after is the ____.", "a": "原图 object，像 image"}, {"t": "选择题 MCQ", "qz": "哪种变换只改变位置不改变方向？ A. 平移 B. 反射 C. 旋转", "qe": "Which changes position but not orientation? A. translation B. reflection C. rotation", "a": "A"}]}, {"id": "u5s1", "zh": "平移", "en": "Translations", "page": 339, "ez": "平移把图形整体沿同一方向移动同样距离，形状、大小、方向都不变。用列向量 (x 上, y 下) 描述：上面是水平移动（正为右），下面是竖直移动（正为上）。", "ee": "A translation slides every point the same distance in the same direction; shape, size and orientation are unchanged. Describe with a column vector: top = horizontal (positive right), bottom = vertical (positive up).", "terms": ["translation 平移", "column vector 列向量"], "ex": "向量 (5, −4)ᵀ：右移 5，下移 4", "yt": "corbettmaths translations vectors", "bili": "平移 列向量", "qs": [{"t": "计算题 Calculation", "qz": "点 (2, 3) 按向量 (−4, 1)ᵀ 平移后？", "qe": "Translate (2, 3) by (−4, 1)ᵀ.", "a": "(−2, 4)"}, {"t": "计算题 Calculation", "qz": "(1, −2) 移到 (6, 3)，平移向量？", "qe": "(1, −2) moves to (6, 3). Vector?", "a": "(5, 5)ᵀ"}, {"t": "填空题 Fill in", "qz": "向量 (0, −3)ᵀ 表示向 ____ 移 3。", "qe": "(0, −3)ᵀ means move 3 ____.", "a": "下 down"}, {"t": "判断题 True/False", "qz": "平移后图形方向会改变。", "qe": "A translation changes orientation.", "a": "错误 False"}]}, {"id": "u5s2", "zh": "反射与旋转", "en": "Reflections & rotations", "page": 341, "ez": "反射：要说明对称轴（镜线）方程，如 x = 2、y = −1、y = x、y = −x。旋转：要说明旋转中心、角度和方向（逆时针为 +，顺时针为 −）。两者都会改变方向（朝向）和位置。", "ee": "Reflection: state the mirror line, e.g. x = 2, y = −1, y = x, y = −x. Rotation: state the centre, the angle and the direction (anticlockwise +, clockwise −). Both change orientation and position.", "terms": ["reflection 反射", "mirror line 对称轴", "rotation 旋转", "centre of rotation 旋转中心", "clockwise 顺时针", "anticlockwise 逆时针"], "ex": "点 (3, 1) 关于 y = x 反射 → (1, 3)；绕原点顺时针 90° → (1, −3)", "yt": "corbettmaths reflections rotations", "bili": "轴对称 旋转 旋转中心", "qs": [{"t": "计算题 Calculation", "qz": "(4, 2) 关于 x 轴反射？", "qe": "Reflect (4, 2) in the x-axis.", "a": "(4, −2)"}, {"t": "计算题 Calculation", "qz": "(3, 1) 关于 y = −x 反射？", "qe": "Reflect (3, 1) in y = −x.", "a": "(−1, −3)"}, {"t": "计算题 Calculation", "qz": "(2, 5) 绕原点旋转 180°？", "qe": "Rotate (2, 5) 180° about the origin.", "a": "(−2, −5)"}, {"t": "判断题 True/False", "qz": "描述旋转时只需给出角度。", "qe": "To describe a rotation you only need the angle.", "a": "错误 False（还需中心和方向）"}]}, {"id": "u5s3", "zh": "放大", "en": "Enlargements", "page": 344, "ez": "放大要说明比例因子和放大中心。像的每个点到中心的距离 = 原距离 × 比例因子。比例因子 > 1 变大；0 < k < 1 变小（仍叫 enlargement）；比例因子为正时方向不变。找中心：连接对应点并延长，交点即中心。", "ee": "To describe an enlargement give the scale factor and the centre. Distances from the centre are multiplied by the scale factor. k > 1 makes it bigger; 0 < k < 1 smaller (still called an enlargement); with positive k the orientation stays the same. Find the centre by joining corresponding points – the lines meet at the centre.", "terms": ["enlargement 放大（位似）", "scale factor 比例因子", "centre of enlargement 放大中心"], "ex": "以原点为中心比例因子 3：(1, 2) → (3, 6)", "yt": "corbettmaths enlargements", "bili": "位似 放大 比例因子 中心", "qs": [{"t": "计算题 Calculation", "qz": "以原点为中心、比例因子 2 放大 (3, −1)？", "qe": "Enlarge (3, −1) by scale factor 2, centre the origin.", "a": "(6, −2)"}, {"t": "计算题 Calculation", "qz": "以 (1, 1) 为中心、比例因子 2 放大 (3, 2)？", "qe": "Enlarge (3, 2) by scale factor 2 about (1, 1).", "a": "(5, 3)"}, {"t": "计算题 Calculation", "qz": "边长 4 cm 放大为 10 cm，比例因子？", "qe": "A 4 cm side becomes 10 cm. Scale factor?", "a": "2.5"}, {"t": "判断题 True/False", "qz": "比例因子 ½ 的放大会使图形变小。", "qe": "An enlargement with scale factor ½ makes the shape smaller.", "a": "正确 True"}]}, {"id": "u5s4", "zh": "组合变换", "en": "Combined transformations", "page": 348, "ez": "组合变换是连续进行的几个变换，按顺序逐个作图。常能用一个单一变换描述结果（如两次平行镜线的反射 = 平移）。逆变换把像变回原图：比例因子 3 放大的逆变换是比例因子 ⅓ 放大；顺时针 90° 的逆是逆时针 90°。", "ee": "Combined transformations are carried out one after another, in order. The result can often be described by a single transformation (e.g. two reflections in parallel lines = a translation). The inverse undoes it: the inverse of enlargement ×3 is ×⅓; of 90° clockwise is 90° anticlockwise.", "terms": ["combined transformation 组合变换", "inverse 逆变换", "single transformation 单一变换"], "ex": "三角形 P 先按 (5, 4)ᵀ 平移得 Q，再关于 y = x 反射得 R，再绕 (1, 1) 顺时针 90° 得 S", "yt": "combined transformations gcse maths", "bili": "复合变换 逆变换", "qs": [{"t": "填空题 Fill in", "qz": "按向量 (3, −2)ᵀ 平移的逆变换是按 ____ 平移。", "qe": "The inverse of translation (3, −2)ᵀ is translation ____.", "a": "(−3, 2)ᵀ"}, {"t": "计算题 Calculation", "qz": "(1, 2) 先关于 y 轴反射，再关于 x 轴反射，得？", "qe": "Reflect (1, 2) in the y-axis, then in the x-axis.", "a": "(−1, −2)"}, {"t": "选择题 MCQ", "qz": "上题的组合等价于： A. 平移 B. 绕原点 180° 旋转 C. 关于 y = x 反射", "qe": "That combination equals: A. translation B. rotation 180° about origin C. reflection in y = x", "a": "B"}, {"t": "判断题 True/False", "qz": "组合变换的顺序不影响结果。", "qe": "The order of combined transformations never matters.", "a": "错误 False"}]}]}, {"id": "u5h", "unit": "第5单元 Unit 5", "zh": "数据处理 4", "en": "Handling Data 4", "page": 357, "kps": [{"id": "u5h1", "zh": "单一事件的概率", "en": "Probability – single events", "page": 357, "ez": "概率在 0（不可能）到 1（必然）之间，可用分数、小数或百分数表示。p(A) 表示 A 发生的概率，p(A′) 表示 A 不发生的概率，p(A) + p(A′) = 1。", "ee": "Probability lies from 0 (impossible) to 1 (certain), as a fraction, decimal or percentage. p(A) is the probability of A; p(A′) the probability of A not happening; p(A) + p(A′) = 1.", "terms": ["probability 概率", "event 事件", "outcome 结果", "impossible 不可能", "certain 必然"], "ex": "一年 365 天中有 40 天鸟在 9 点前到：p(A) = 40/365 = 8/73，p(A′) = 65/73", "yt": "corbettmaths probability basics", "bili": "概率 基础 事件", "qs": [{"t": "计算题 Calculation", "qz": "p(下雨) = 0.35，p(不下雨)？", "qe": "p(rain) = 0.35. p(not rain)?", "a": "0.65"}, {"t": "判断题 True/False", "qz": "概率可以是 1.2。", "qe": "A probability can be 1.2.", "a": "错误 False"}, {"t": "选择题 MCQ", "qz": "掷硬币正面朝上的概率： A. 0 B. ½ C. 1 D. 2", "qe": "Probability of heads: A. 0 B. ½ C. 1 D. 2", "a": "B. ½"}, {"t": "填空题 Fill in", "qz": "p(A) + p(A′) = ____", "qe": "p(A) + p(A′) = ____", "a": "1"}]}, {"id": "u5h2", "zh": "实验概率（相对频率）", "en": "Experimental probability (relative frequency)", "page": 358, "ez": "实验概率（相对频率）= 事件发生次数 ÷ 总试验次数。试验次数越多，相对频率越接近理论概率。可用来判断骰子或硬币是否公平（有偏 biased）。", "ee": "Experimental probability (relative frequency) = number of times the event occurs ÷ total number of trials. The more trials, the closer it gets to the theoretical probability. Used to judge whether a dice or coin is biased.", "terms": ["relative frequency 相对频率", "trial 试验", "biased 有偏", "fair 公平"], "ex": "图钉抛 200 次，尖朝上 130 次：相对频率 = 0.65", "yt": "corbettmaths relative frequency", "bili": "频率 估计概率 相对频率", "qs": [{"t": "计算题 Calculation", "qz": "骰子掷 120 次，出现 6 点 30 次，相对频率？", "qe": "A dice is rolled 120 times; 6 appears 30 times. Relative frequency?", "a": "0.25"}, {"t": "判断题 True/False", "qz": "上题说明骰子可能有偏。", "qe": "This suggests the dice may be biased.", "a": "正确 True（理论为 1/6 ≈ 0.167）"}, {"t": "选择题 MCQ", "qz": "哪种情况相对频率最可靠？ A. 10 次 B. 100 次 C. 1000 次", "qe": "Which gives the most reliable relative frequency? A. 10 trials B. 100 C. 1000", "a": "C"}, {"t": "计算题 Calculation", "qz": "500 名疫苗接种的小狗中 4 只过敏，估计过敏概率。", "qe": "4 of 500 vaccinated puppies react. Estimate the probability of a reaction.", "a": "0.008"}]}, {"id": "u5h3", "zh": "理论概率、期望频数与样本空间", "en": "Theoretical probability, expected frequency & sample spaces", "page": 362, "ez": "等可能结果时，理论概率 p(A) = 有利结果数 ÷ 所有可能结果数。p(A′) = 1 − p(A)。期望频数 = 试验次数 × 概率（如掷 60 次期望 10 次 6 点）。样本空间（概率空间）图列出所有可能结果，如两个骰子共 36 种结果，一副牌 52 张。", "ee": "For equally likely outcomes, p(A) = favourable outcomes ÷ total outcomes; p(A′) = 1 − p(A). Expected frequency = number of trials × probability (60 rolls → expect ten 6s). A sample space diagram lists all outcomes, e.g. 36 for two dice, 52 cards in a pack.", "terms": ["theoretical probability 理论概率", "equally likely 等可能", "expected frequency 期望频数", "sample space 样本空间"], "ex": "一副 52 张牌抽到 K：4/52 = 1/13；两骰子点数和为 7：6/36 = 1/6", "yt": "corbettmaths sample space diagrams expected frequency", "bili": "样本空间 列表法 期望频数", "qs": [{"t": "计算题 Calculation", "qz": "从 52 张牌中抽到红心的概率？", "qe": "Probability of drawing a heart from 52 cards?", "a": "13/52 = 1/4"}, {"t": "计算题 Calculation", "qz": "掷两枚骰子，点数和为 10 的概率？", "qe": "Two dice: probability the total is 10?", "a": "3/36 = 1/12"}, {"t": "计算题 Calculation", "qz": "p(红) = 0.3，抽 200 次期望几次红？", "qe": "p(red) = 0.3. Expected reds in 200 trials?", "a": "60"}, {"t": "应用题 Word problem", "qz": "袋中 3 红 5 蓝 2 绿，取一个不是蓝的概率？", "qe": "Bag: 3 red, 5 blue, 2 green. Probability not blue?", "a": "5/10 = 1/2"}]}]}, {"id": "ext", "unit": "附录 Extras", "zh": "拓展：事实探究与挑战题", "en": "Fact Finders & Challenges", "page": 372, "kps": [{"id": "ext1", "zh": "事实探究（Fact Finders）", "en": "Fact Finders (real-data comprehension)", "page": 372, "ez": "书末 5 篇 Fact Finder：蚂蚁（Ants）、脆弱的地球（Fragile Earth）、大白鲨（Great White Shark）、2012 伦敦奥运会（London 2012 Olympic Games）、神奇的人体（The Incredible Human Body）。阅读真实数据并综合运用：科学记数法、百分数、比例、速度与单位换算、估算、球面积公式等，答案一般保留 3 位有效数字。", "ee": "Five Fact Finders at the back – Ants, Fragile Earth, Great White Shark, London 2012 Olympic Games, The Incredible Human Body – practise reading real data using standard form, percentages, proportion, speed and unit conversion, estimation and formulae. Give answers to 3 s.f.", "terms": ["comprehension 理解", "real data 真实数据", "unit conversion 单位换算", "proportion 比例"], "ex": "书中数据（蚂蚁）：11 800 个物种，起源于 1.3 亿年前；地中海沿岸 600 km 长的蚁群约 10 亿只；爬行速度 75 mm/s；能举起自身体重 50 倍", "yt": "maths real life problems standard form percentages gcse", "bili": "数学 实际应用 科学记数法 百分数", "qs": [{"t": "应用题 Word problem", "qz": "蚂蚁 1.3 亿年间进化出 11 800 个物种，平均每百万年多少种？", "qe": "11 800 ant species evolved over 130 million years. Species per million years?", "a": "11 800 ÷ 130 ≈ 90.8"}, {"t": "应用题 Word problem", "qz": "若人能像蚂蚁一样举起自身体重 50 倍，90 kg 的人能举多重？与 1 吨的汽车比较。", "qe": "If a man could lift 50 times his weight like an ant, what could a 90 kg man lift? Compare with a 1-tonne car.", "a": "4500 kg = 4.5 吨，约 4.5 辆车"}, {"t": "应用题 Word problem", "qz": "600 km 海岸线上有 10 亿只蚂蚁，每厘米多少只？", "qe": "1 billion ants along 600 km of coast. Ants per cm?", "a": "10⁹ ÷ (6 × 10⁷ cm) ≈ 16.7 只"}, {"t": "应用题 Word problem", "qz": "蚂蚁以 75 mm/s 爬行，离巢 200 m 后返回需多少时间（不休息）？", "qe": "Ants crawl at 75 mm/s. Time for a 200 m return journey without rest?", "a": "200 000 ÷ 75 ≈ 2670 s ≈ 44.4 分钟"}, {"t": "应用题 Word problem", "qz": "地球人口从 61.7 亿（2000）增长到 73 亿，增长百分比？", "qe": "World population grew from 6.17 billion (2000) to 7.3 billion. Percentage increase?", "a": "≈ 18.3%"}]}, {"id": "ext2", "zh": "挑战题（Challenges）", "en": "Challenges", "page": 382, "ez": "挑战题把基本原理用于不寻常的情境，需要综合推理：代数证明、几何推理、数论（因数、质数）、规律探索等。建议在完成全部 5 个单元后作为拓展。", "ee": "Challenges apply basic principles in unusual situations and need combined reasoning: algebraic proof, geometric reasoning, number theory (factors, primes) and pattern spotting. Attempt them after finishing all five units.", "terms": ["proof 证明", "reasoning 推理", "pattern 规律"], "ex": "“想一个数，加 7，乘 2，减 10，除以 2，再减原数”——用代数证明结果总是 2", "yt": "maths problem solving challenge gcse higher", "bili": "数学 思维 挑战题 证明", "qs": [{"t": "应用题 Word problem", "qz": "用代数证明：任意两个连续整数之和是奇数。", "qe": "Prove that the sum of two consecutive integers is odd.", "a": "n + (n + 1) = 2n + 1，是奇数"}, {"t": "应用题 Word problem", "qz": "想一个数，翻倍，加 12，取一半，再减原数。结果是？", "qe": "Think of a number, double it, add 12, halve, subtract the original. Result?", "a": "(2x + 12)/2 − x = 6"}, {"t": "应用题 Word problem", "qz": "证明：三个连续整数之和是 3 的倍数。", "qe": "Prove the sum of three consecutive integers is a multiple of 3.", "a": "n + (n+1) + (n+2) = 3(n + 1)"}, {"t": "计算题 Calculation", "qz": "正多边形内角是外角的 4 倍，它有几条边？", "qe": "A regular polygon's interior angle is 4 times its exterior. How many sides?", "a": "外角 36°，n = 10"}]}]}];

<p class="mut">使用建议：每天 30–60 分钟；先读讲解与例题 → 做练习题再看答案 → 不会的看视频 → 课本对应页练习 → 勾选“已掌握”。顶部可切换 中文 / English / 双语。视频链接为 YouTube、B站、Khan Academy 的搜索结果页（打开需联网），可挑选播放量高的讲解视频。</p>
<a class="btn" href="#plan">📅 查看每日学习计划</a><a class="btn g" href="#quiz">🎲 随机自测</a><a class="btn g" href="#toc">📚 全部知识点目录</a>
</section>`;
// plan
h+=`<section id="plan"><h2>📅 每日学习计划 Daily Study Plan（${PLAN.length} 天）</h2><p class="mut">共 ${PLAN.filter(d=>d.type=='learn').length} 个新课日 + ${PLAN.filter(d=>d.type=='review').length} 个复习日；每天约 35–60 分钟。建议每周学 5–6 天，休息日可补进度。点击知识点直接跳转。<button class="btn g" id="resetPlan" style="padding:4px 10px">重置进度</button></p><div class="days">`;
PLAN.forEach(d=>{
 const list=d.type=='review'?`<li><span class="zh">复习本阶段 ${d.kps.length} 个知识点：</span>${[...new Set(d.kps.map(id=>KP[id].ch.id))].map(cid=>`<a href="#${cid}">${esc(CH[cid].zh)}</a>`).join('、')}</li>`:d.kps.map(id=>`<li><a href="#${id}">${KP[id].no} ${esc(KP[id].zh)}</a><span class="en"> ${esc(KP[id].en)}</span> <span class="mut">p.${KP[id].page}</span></li>`).join('');
 const ex=d.extra.map(e=>`<div class="ex">📝 <span class="zh">${esc(e.zh)}</span><span class="en"> ${esc(e.en)}</span></div>`).join('');
 const qb=d.type=='review'?`<button class="btn" style="padding:4px 10px;font-size:13px" data-quiz="${esc(d.unit)}">🎲 本阶段随机自测</button>`:'';
 h+=`<div class="day ${d.type=='review'?'rev':''}" id="day${d.n}"><label><input type="checkbox" data-day="${d.n}"><span>第 ${d.n} 天 ${d.type=='review'?'<span class="pill rev">复习</span>':'<span class="pill">新课</span>'}<span class="mut">≈${d.mins} 分钟</span><br><span class="zh">${esc(d.tz)}</span><span class="en" style="font-weight:400"> ${esc(d.te)}</span></span></label><ul>${list}</ul>${ex}${qb}</div>`;
});
h+=`</div></section>`;
// quiz
h+=`<section id="quiz" class="card"><h2 style="margin-top:0">🎲 随机自测 Random self-test</h2><div class="mut">选择范围后随机抽题，做完再点开答案核对。</div>
<select id="qScope" style="padding:8px;border-radius:8px;font-size:15px;margin:8px 6px 8px 0"><option value="all">全书 All units</option>${[...new Set(DATA.map(c=>c.unit))].map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join('')}${DATA.map(c=>`<option value="ch:${c.id}">— ${esc(c.unit.split(' ')[0])} ${esc(c.zh)} ${esc(c.en)}</option>`).join('')}</select>
<select id="qN" style="padding:8px;border-radius:8px;font-size:15px"><option>5</option><option selected>10</option><option>15</option><option>20</option></select>
<button class="btn" id="qGo">开始抽题</button><div id="qOut"></div></section>`;
// toc
h+=`<section id="toc" class="card"><h2 style="margin-top:0">📚 知识点总目录 Contents</h2>`;
let lastU='';
DATA.forEach(c=>{if(c.unit!==lastU){h+=`<div style="margin-top:8px;font-weight:700;color:#1e3a8a">${esc(c.unit)}</div>`;lastU=c.unit}
 h+=`<div><a href="#${c.id}"><b>${esc(c.zh)} ${esc(c.en)}</b></a> <span class="mut">p.${c.page}</span><br><span class="mut">${c.kps.map(k=>`<a href="#${k.id}">${k.no} ${esc(k.zh)}</a>`).join(' · ')}</span></div>`});
h+=`</section>`;
// chapters
DATA.forEach(c=>{
 h+=`<section id="${c.id}"><div class="chap-h"><div class="mut">${esc(c.unit)} · 课本第 ${c.page} 页起</div><h2>${esc(c.zh)} <span style="font-weight:400">${esc(c.en)}</span></h2><div class="mut">${c.kps.length} 个知识点 · ${c.kps.reduce((a,k)=>a+k.qs.length,0)} 道练习</div></div>`;
 c.kps.forEach(k=>{
  h+=`<article class="card kp" id="${k.id}" data-s="${esc((k.zh+' '+k.en+' '+k.terms.join(' ')+' '+c.zh+' '+c.en).toLowerCase())}">
<h3><span class="no">${k.no}</span>${esc(k.zh)}<br><span class="en" style="font-weight:500;font-size:16px">${esc(k.en)}</span></h3>
<div class="mut">📖 课本第 ${k.page} 页 · ${esc(c.zh)} ${esc(c.en)}</div>
<div class="blk"><div class="lbl">💡 知识讲解 Explanation</div><div class="zh">${esc(k.ez)}</div><div class="en">${esc(k.ee)}</div></div>
<div class="blk"><div class="lbl">🔑 关键术语 Key terms</div><div class="terms">${k.terms.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div>
<div class="blk"><div class="lbl">✏️ 例题 Worked example</div><div class="ex-box">${esc(k.ex)}</div></div>
<div class="blk"><div class="lbl">📝 练习题 Practice（${k.qs.length} 题）</div>${k.qs.map((q,i)=>qHTML(q,i+1)).join('')}</div>
<div class="blk"><div class="lbl">🎬 视频辅导 Video help</div><div class="vids">${vids(k)}</div><div class="mut">搜索关键词：${esc(k.yt)} ｜ ${esc(k.bili)}</div></div>
<label class="master"><input type="checkbox" data-kp="${k.id}"> 我已掌握这个知识点 I've mastered this</label>
</article>`});
 h+=`</section>`;
});
h+=`<p class="mut" style="text-align:center;margin-top:30px">本课件为学习辅助，内容依据课本整理；题目为配套练习（部分改编自课本练习）。答案请结合课本 Answers（第 388 页起）核对。</p>`;
$('#app').innerHTML=h;
// nav
let n='<a href="#top">🏠 首页 Overview</a><a href="#plan">📅 每日学习计划</a><a href="#quiz">🎲 随机自测</a>';lastU='';
DATA.forEach(c=>{if(c.unit!==lastU){n+=`<div class="u">${esc(c.unit)}</div>`;lastU=c.unit}
 n+=`<a class="c" href="#${c.id}" data-c="${c.id}">${esc(c.zh)} <span class="mut">${esc(c.en)}</span></a>`+c.kps.map(k=>`<a class="k" href="#${k.id}" data-k="${k.id}" data-s="${esc((k.zh+' '+k.en+' '+k.terms.join(' ')).toLowerCase())}">${k.no} <span class="zh">${esc(k.zh)}</span><span class="en"> ${esc(k.en)}</span></a>`).join('')});
$('#nav').innerHTML=n;
// lang
function setLang(l){document.body.classList.remove('l-zh','l-en','l-bi');document.body.classList.add('l-'+l);document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l==l));LS.set('igcse_lang',l)}
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
setLang(LS.get('igcse_lang','bi'));
// nav toggle
$('#burger').onclick=()=>document.body.classList.toggle('nav-open');
$('#overlay').onclick=()=>document.body.classList.remove('nav-open');
$('#nav').addEventListener('click',e=>{if(e.target.closest('a'))document.body.classList.remove('nav-open')});
// progress
let days=LS.get('igcse_days',{}),mast=LS.get('igcse_mast',{});
function upd(){const dn=PLAN.filter(d=>days[d.n]).length;$('#progTxt').textContent=`${dn} / ${PLAN.length} 天`;$('#progBar').style.width=(dn/PLAN.length*100)+'%';
 const mn=Object.keys(KP).filter(k=>mast[k]).length;$('#mastTxt').textContent=`${mn} / ${kno}`;$('#mastBar').style.width=(mn/kno*100)+'%';
 document.querySelectorAll('[data-day]').forEach(c=>{c.checked=!!days[c.dataset.day];c.closest('.day').classList.toggle('done',c.checked)});
 document.querySelectorAll('[data-kp]').forEach(c=>c.checked=!!mast[c.dataset.kp]);
 document.querySelectorAll('#nav .k').forEach(a=>a.classList.toggle('done',!!mast[a.dataset.k]));}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.day){days[t.dataset.day]=t.checked;LS.set('igcse_days',days);upd()}if(t.dataset.kp){mast[t.dataset.kp]=t.checked;LS.set('igcse_mast',mast);upd()}});
$('#resetPlan').onclick=()=>{if(confirm('确定清除所有学习进度与掌握记录？')){days={};mast={};LS.set('igcse_days',days);LS.set('igcse_mast',mast);upd()}};
upd();
if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el)setTimeout(()=>el.scrollIntoView({behavior:'auto'}),0)}
// search
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();
 document.querySelectorAll('#nav .k').forEach(a=>a.classList.toggle('hide',q&&!a.dataset.s.includes(q)));
 document.querySelectorAll('#nav .c,#nav .u').forEach(a=>a.classList.toggle('hide',!!q));
 document.querySelectorAll('article.kp').forEach(a=>a.classList.toggle('hide',q&&!a.dataset.s.includes(q)));
 document.querySelectorAll('main section[id^=u],main section#ext').forEach(s=>s.classList.toggle('hide',q&&!s.querySelector('article.kp:not(.hide)')));});
// quiz
function runQuiz(scope,num){let pool=[];DATA.forEach(c=>{const ok=scope=='all'||scope==='ch:'+c.id||scope.split('|').includes(c.unit);if(ok)c.kps.forEach(k=>k.qs.forEach(q=>pool.push([k,q])))});
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 pool=pool.slice(0,num);$('#qOut').innerHTML=pool.map(([k,q],i)=>qHTML(q,i+1).replace('</details>',`</details><div class="mut">来自 <a href="#${k.id}">${k.no} ${esc(k.zh)}</a></div>`)).join('')||'<p>无题目</p>';}
$('#qGo').onclick=()=>runQuiz($('#qScope').value,+$('#qN').value);
document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{const u=b.dataset.quiz;const sel=$('#qScope');if([...sel.options].some(o=>o.value==u))sel.value=u;runQuiz(u,u.includes('|')?15:10);location.hash='#quiz'});
})();
</script>
</body>
</html>
