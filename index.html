<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>IGCSE 数学 A（Student Book 1）双语学习课件</title>
<style>
:root{--bg:#f7f8fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#2563eb;--pri2:#dbeafe;--ok:#16a34a;--warn:#f59e0b;--line:#e5e7eb;--side:290px;--top:56px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px}
a{color:var(--pri);text-decoration:none}
select{max-width:100%}
.wrap{min-width:0;overflow-wrap:anywhere}
header.top{position:fixed;top:0;left:0;right:0;height:calc(var(--top) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:#1e3a8a;color:#fff;display:flex;align-items:center;gap:8px;padding-left:10px;padding-right:10px;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top .title{min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.burger{background:none;border:0;color:#fff;font-size:24px;padding:4px 8px;cursor:pointer}
.seg{display:flex;background:rgba(255,255,255,.15);border-radius:999px;padding:2px}
.seg button{border:0;background:none;color:#fff;padding:5px 10px;border-radius:999px;font-size:13px;cursor:pointer}
.seg button.on{background:#fff;color:#1e3a8a;font-weight:700}
aside.side{position:fixed;top:calc(var(--top) + env(safe-area-inset-top));bottom:0;left:0;width:var(--side);background:#fff;border-right:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;z-index:40;padding:10px 10px 40px;transition:transform .25s}
.side input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:8px}
.side .nav a{display:block;padding:5px 8px;border-radius:8px;color:var(--ink);font-size:14px}
.side .nav a:hover{background:var(--pri2)}
.side .nav .u{font-weight:700;color:#1e3a8a;margin-top:10px;font-size:13px;padding-left:8px}
.side .nav .c{font-weight:600}
.side .nav .k{padding-left:22px;font-size:13px;color:#374151}
.side .nav .k.done::after{content:" ✓";color:var(--ok)}
main{margin-left:var(--side);padding:calc(var(--top) + env(safe-area-inset-top) + 16px) 18px 60px;max-width:calc(980px + var(--side))}
.wrap{max-width:960px}
section,.card{scroll-margin-top:calc(var(--top) + 20px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
h1{font-size:24px;margin:.2em 0}
h2{font-size:21px;margin:1.4em 0 .4em;color:#1e3a8a}
h3{font-size:18px;margin:.2em 0 .5em}
.mut{color:var(--mut);font-size:14px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--pri2);color:#1e40af;font-size:12px;margin-right:4px;white-space:nowrap}
.pill.rev{background:#fef3c7;color:#92400e}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.stat{background:var(--pri2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:#1e3a8a}
.bar{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;position:relative}
.day.done{background:#f0fdf4;border-color:#86efac}
.day.rev{border-left:4px solid var(--warn)}
.day label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-weight:600}
.day input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--ok)}
.day ul{margin:6px 0 0;padding-left:20px;font-size:14px}
.day .ex{font-size:13px;color:#92400e;margin-top:4px}
.chap-h{background:linear-gradient(90deg,#1e3a8a,#2563eb);color:#fff;border-radius:14px;padding:14px 18px;margin-top:28px}
.chap-h h2{color:#fff;margin:0}
.chap-h .mut{color:#dbeafe}
.kp h3 .no{color:var(--pri);margin-right:6px}
.blk{margin:10px 0}
.blk>.lbl{font-weight:700;font-size:14px;color:#1e40af;margin-bottom:4px}
.en{color:#334155}
body.l-bi div.en,body.l-bi p.en{border-left:3px solid #c7d2fe;padding-left:8px;margin-top:4px}
body.l-bi span.en{color:#475569}
body.l-zh .en{display:none!important}
body.l-en .zh{display:none!important}
.terms span{display:inline-block;background:#f1f5f9;border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:3px 4px 3px 0;font-size:14px}
.ex-box{background:#f8fafc;border:1px dashed #94a3b8;border-radius:10px;padding:8px 12px;font-size:15px}
.q{border-top:1px solid var(--line);padding:10px 0}
.q:first-of-type{border-top:0}
.qt{font-size:12px;color:#fff;background:#64748b;border-radius:6px;padding:1px 7px;margin-right:6px}
details{margin-top:6px}
details summary{cursor:pointer;color:var(--pri);font-size:14px;list-style:none;display:inline-block;padding:4px 12px;border:1px solid #bfdbfe;border-radius:999px;background:#eff6ff;-webkit-user-select:none;user-select:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{background:var(--pri);color:#fff}
details .ans{margin-top:6px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:8px 12px}
.vids a{display:inline-block;margin:3px 6px 3px 0;padding:6px 12px;border-radius:10px;font-size:14px;color:#fff}
.vids .yt{background:#dc2626}.vids .bl{background:#0ea5e9}.vids .ka{background:#14b8a6}.vids .cm{background:#7c3aed}
.master{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px;color:var(--mut)}
.master input{width:18px;height:18px;accent-color:var(--ok)}
.btn{display:inline-block;border:0;background:var(--pri);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;cursor:pointer;margin:4px 6px 4px 0}
.btn.g{background:#e2e8f0;color:#1f2937}
.hide{display:none!important}
#quiz .q{border-top:1px solid var(--line)}
.backtop{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:#1e3a8a;color:#fff;border-radius:999px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:30}
.overlay{display:none}
@media (max-width:900px){
 .seg{flex:none}
 aside.side{transform:translateX(-105%);width:min(86vw,320px);box-shadow:4px 0 16px rgba(0,0,0,.2)}
 body.nav-open aside.side{transform:none}
 body.nav-open .overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
 main{margin-left:0;padding-left:12px;padding-right:12px}
 header.top .title{font-size:14px}
 .seg button{padding:5px 8px;font-size:12px}
}
@media (min-width:901px){.burger{display:none}}
@media print{aside.side,header.top,.backtop{display:none}main{margin:0;padding:0}details .ans{display:block}}
</style>

<script>
const DATA=[{"id": "u1n", "unit": "第1单元 Unit 1", "zh": "数 1", "en": "Number 1", "page": 3, "kps": [{"id": "u1n1", "zh": "分数的化简与转换", "en": "Simplifying & converting fractions", "page": 3, "ez": "化简分数：分子分母同除以最大公因数。分数化小数：分子 ÷ 分母（如 2/5 = 0.4，5/8 = 0.625）。带分数与假分数可互相转换：2¾ = 11/4。做题时始终把分数化到最简。", "ee": "Simplify a fraction by dividing numerator and denominator by their highest common factor. To change a fraction to a decimal, divide numerator by denominator (2/5 = 0.4, 5/8 = 0.625). Mixed numbers and improper fractions can be converted: 2¾ = 11/4. Always simplify fractions.", "terms": ["numerator 分子", "denominator 分母", "mixed number 带分数", "improper fraction 假分数", "lowest terms 最简形式"], "ex": "16/24 = 2/3（÷8）；17/5 = 3⅖；0.75 = 3/4", "yt": "corbettmaths simplifying fractions", "bili": "分数化简 假分数 带分数", "qs": [{"t": "选择题 MCQ", "qz": "56/84 化简后是？ A. 7/12  B. 2/3  C. 14/21  D. 4/6", "qe": "Simplify 56/84. A. 7/12  B. 2/3  C. 14/21  D. 4/6", "a": "B. 2/3（HCF = 28）"}, {"t": "计算题 Calculation", "qz": "把 19/7 写成带分数。", "qe": "Write 19/7 as a mixed number.", "a": "2 5/7"}, {"t": "填空题 Fill in", "qz": "0.6/1.2 = ____（最简分数）", "qe": "0.6/1.2 = ____ (lowest terms)", "a": "1/2"}, {"t": "应用题 Word problem", "qz": "18 分钟是 1 小时的几分之几？", "qe": "What fraction of an hour is 18 minutes?", "a": "18/60 = 3/10"}]}, {"id": "u1n2", "zh": "分数的乘法与除法", "en": "Multiplying & dividing fractions", "page": 6, "ez": "“of（的）”表示乘法。先把带分数化为假分数，能约分先约分再相乘。除以一个分数等于乘以它的倒数（翻转后相乘）。整数可写成分母为1的分数，如 5 = 5/1。", "ee": "The word 'of' means 'multiplied by'. Convert mixed numbers to improper fractions first and cancel common factors before multiplying. Dividing by a fraction is the same as multiplying by its reciprocal. Treat whole numbers as fractions, e.g. 5 = 5/1.", "terms": ["reciprocal 倒数", "cancel 约分", "of 的（乘）", "product 积"], "ex": "1⅓ × 1¾ = 4/3 × 7/4 = 7/3 = 2⅓；  3/4 ÷ 3/8 = 3/4 × 8/3 = 2", "yt": "corbettmaths multiplying fractions dividing fractions", "bili": "分数乘除法 倒数", "qs": [{"t": "计算题 Calculation", "qz": "计算 4/5 × 3/8（最简）。", "qe": "Work out 4/5 × 3/8 in lowest terms.", "a": "12/40 = 3/10"}, {"t": "计算题 Calculation", "qz": "计算 2½ ÷ 1¼。", "qe": "Work out 2½ ÷ 1¼.", "a": "5/2 × 4/5 = 2"}, {"t": "应用题 Word problem", "qz": "Riley 的歌曲中 3/7 是摇滚，摇滚中 7/9 有吉他独奏。有吉他独奏的摇滚歌占全部的几分之几？", "qe": "3/7 of Riley's songs are rock; 7/9 of the rock songs have a guitar solo. What fraction of all songs are rock songs with a guitar solo?", "a": "3/7 × 7/9 = 1/3"}, {"t": "判断题 True/False", "qz": "除以 1/2 等于乘以 2。", "qe": "Dividing by 1/2 is the same as multiplying by 2.", "a": "正确 True"}]}, {"id": "u1n3", "zh": "分数的加法与减法", "en": "Adding & subtracting fractions", "page": 9, "ez": "分数相加减必须先通分（化为公分母）。用最小公分母计算量最少。带分数可以先把整数部分和分数部分分开计算，或全部化为假分数。", "ee": "To add or subtract fractions, put them over a common denominator. Less work is needed if you use the lowest common denominator. With mixed numbers, either deal with whole numbers and fractions separately or convert to improper fractions.", "terms": ["common denominator 公分母", "lowest common denominator 最小公分母", "equivalent fraction 等值分数"], "ex": "10/3 − 7/4 = 40/12 − 21/12 = 19/12 = 1 7/12", "yt": "corbettmaths adding fractions subtracting fractions", "bili": "分数加减法 通分", "qs": [{"t": "计算题 Calculation", "qz": "3/8 + 7/12 = ?", "qe": "3/8 + 7/12 = ?", "a": "9/24 + 14/24 = 23/24"}, {"t": "计算题 Calculation", "qz": "3 1/4 − 1 2/3 = ?", "qe": "3 1/4 − 1 2/3 = ?", "a": "13/4 − 5/3 = 39/12 − 20/12 = 19/12 = 1 7/12"}, {"t": "应用题 Word problem", "qz": "Li 晚饭前完成作业的 1/4，晚饭后又完成 1/3。还剩几分之几没做？", "qe": "Li does 1/4 of her homework before dinner and 1/3 after. What fraction remains undone?", "a": "1 − (3/12 + 4/12) = 5/12"}, {"t": "选择题 MCQ", "qz": "5/6 − 3/4 = ? A. 1/12  B. 2/2  C. 1/6  D. 2/12", "qe": "5/6 − 3/4 = ? A. 1/12  B. 2/2  C. 1/6  D. 2/12", "a": "A. 1/12"}]}, {"id": "u1n4", "zh": "运算顺序 (BIDMAS)", "en": "Order of operations (BIDMAS)", "page": 11, "ez": "BIDMAS：括号 Brackets → 指数 Indices → 除 Division 和 乘 Multiplication（从左到右）→ 加 Addition 和 减 Subtraction（从左到右）。计算器也遵循这一顺序；分数线相当于括号。", "ee": "BIDMAS: Brackets, Indices, Division and Multiplication (left to right), Addition and Subtraction (left to right). Calculators follow this order; a fraction line acts like brackets.", "terms": ["brackets 括号", "indices 指数/乘方", "order of operations 运算顺序"], "ex": "3 + 4 × 2² = 3 + 4 × 4 = 3 + 16 = 19；(3 + 4) × 2 = 14", "yt": "corbettmaths BIDMAS order of operations", "bili": "运算顺序 BIDMAS 先乘除后加减", "qs": [{"t": "计算题 Calculation", "qz": "计算 8 − 2 × 3 + 1。", "qe": "Work out 8 − 2 × 3 + 1.", "a": "8 − 6 + 1 = 3"}, {"t": "计算题 Calculation", "qz": "计算 (5 − 2)² × 2 − 4 ÷ 2。", "qe": "Work out (5 − 2)² × 2 − 4 ÷ 2.", "a": "9 × 2 − 2 = 16"}, {"t": "填空题 Fill in", "qz": "在 4 + 6 ÷ 2 中加括号使结果为 5：____", "qe": "Insert brackets in 4 + 6 ÷ 2 so the answer is 5: ____", "a": "(4 + 6) ÷ 2 = 5"}, {"t": "判断题 True/False", "qz": "12 ÷ 3 × 2 = 2。", "qe": "12 ÷ 3 × 2 = 2.", "a": "错误 False，从左到右：4 × 2 = 8"}]}, {"id": "u1n5", "zh": "有效数字与小数位", "en": "Significant figures & decimal places", "page": 13, "ez": "第一个有效数字是从左数第一个非零数字。保留小数位数时，从小数点后开始数。若下一位数字 ≥ 5，则进一（四舍五入）。整数保留有效数字时要用 0 占位（87 602 → 88 000，2 s.f.）。", "ee": "The first significant figure is the first non-zero digit from the left. For decimal places, count digits after the decimal point. If the next digit is 5 or more, round up. Use zeros as place-holders for large numbers (87 602 → 88 000 to 2 s.f.).", "terms": ["significant figure (s.f.) 有效数字", "decimal place (d.p.) 小数位", "round 四舍五入", "degree of accuracy 精确度"], "ex": "0.1045 → 0.105 (3 s.f.)；34.777 → 34.78 (2 d.p.)；783 → 800 (1 s.f.)", "yt": "corbettmaths significant figures rounding decimal places", "bili": "有效数字 四舍五入 小数位", "qs": [{"t": "计算题 Calculation", "qz": "把 0.5057 保留 3 位有效数字。", "qe": "Write 0.5057 to 3 s.f.", "a": "0.506"}, {"t": "计算题 Calculation", "qz": "把 80 290 保留 3 位有效数字。", "qe": "Write 80 290 to 3 s.f.", "a": "80 300"}, {"t": "选择题 MCQ", "qz": "3.009 保留 1 位小数是？ A. 3.0  B. 3.01  C. 3  D. 3.1", "qe": "3.009 to 1 d.p. is? A. 3.0  B. 3.01  C. 3  D. 3.1", "a": "A. 3.0"}, {"t": "判断题 True/False", "qz": "0.00438 的第一个有效数字是 4。", "qe": "The first significant figure of 0.00438 is 4.", "a": "正确 True"}]}]}, {"id": "u1a", "unit": "第1单元 Unit 1", "zh": "代数 1", "en": "Algebra 1", "page": 19, "kps": [{"id": "u1a1", "zh": "化简代数式（合并同类项）", "en": "Simplifying algebraic expressions", "page": 20, "ez": "字母代表数。只有同类项（字母及其指数完全相同）才能相加减：3ab + 2ab = 5ab，但 3ab + b 不能合并；ab = ba。可代入数值检查化简结果。", "ee": "Letters stand for numbers. You can only add or subtract like terms (same letters and powers): 3ab + 2ab = 5ab, but 3ab + b cannot be combined; ab = ba. Check simplifications by substituting numbers.", "terms": ["like terms 同类项", "expression 代数式", "coefficient 系数", "substitute 代入"], "ex": "3p³ + 2p² − 2p³ + 5p² = p³ + 7p²", "yt": "corbettmaths collecting like terms", "bili": "合并同类项 代数式化简", "qs": [{"t": "计算题 Calculation", "qz": "化简 4ab + 10bc − 2ab − 5cb。", "qe": "Simplify 4ab + 10bc − 2ab − 5cb.", "a": "2ab + 5bc"}, {"t": "计算题 Calculation", "qz": "化简 2p² − 5p² + 2p − 4p。", "qe": "Simplify 2p² − 5p² + 2p − 4p.", "a": "−3p² − 2p"}, {"t": "判断题 True/False", "qz": "3a² + 2a 可以化简为 5a³。", "qe": "3a² + 2a simplifies to 5a³.", "a": "错误 False（不是同类项 not like terms）"}, {"t": "选择题 MCQ", "qz": "5xy + 2yx = ? A. 7xy  B. 7x²y²  C. 10xy  D. 不能化简", "qe": "5xy + 2yx = ? A. 7xy  B. 7x²y²  C. 10xy  D. cannot simplify", "a": "A. 7xy"}]}, {"id": "u1a2", "zh": "单项式乘法", "en": "Multiplying algebraic terms", "page": 21, "ez": "字母之间的乘号通常省略：3ab 表示 3 × a × b。相乘时系数相乘，同底数的指数相加：3a²b × 2a⁵b⁴ × a = 6a⁸b⁵（a 即 a¹）。", "ee": "The multiplication sign is usually left out: 3ab means 3 × a × b. When multiplying, multiply the numbers and add the powers of the same letter: 3a²b × 2a⁵b⁴ × a = 6a⁸b⁵ (a means a¹).", "terms": ["power / index 幂/指数", "term 项", "product 积"], "ex": "(2a)² × 5a = 4a² × 5a = 20a³", "yt": "corbettmaths multiplying algebraic terms", "bili": "单项式乘法 同底数幂相乘", "qs": [{"t": "计算题 Calculation", "qz": "化简 5a³ × 3a²。", "qe": "Simplify 5a³ × 3a².", "a": "15a⁵"}, {"t": "计算题 Calculation", "qz": "化简 (3y)² × 2y。", "qe": "Simplify (3y)² × 2y.", "a": "18y³"}, {"t": "计算题 Calculation", "qz": "化简 7x × 2y² × (2y)²。", "qe": "Simplify 7x × 2y² × (2y)².", "a": "56xy⁴"}, {"t": "判断题 True/False", "qz": "2x × x = 2x²。", "qe": "2x × x = 2x².", "a": "正确 True"}]}, {"id": "u1a3", "zh": "去括号（展开括号）", "en": "Expanding brackets", "page": 21, "ez": "括号外的项要乘以括号内的每一项：3(x + y) = 3x + 3y。括号前是负号时特别小心：−2(a − 3) = −2a + 6；−(2x + 3) = −2x − 3。展开后再合并同类项。", "ee": "Multiply each term inside the bracket by the term outside: 3(x + y) = 3x + 3y. Be very careful with negative signs: −2(a − 3) = −2a + 6; −(2x + 3) = −2x − 3. Then collect like terms.", "terms": ["expand 展开", "bracket 括号", "negative sign 负号"], "ex": "0.4(x − 3y) + 0.5(2x + 3y) = 0.4x − 1.2y + x + 1.5y = 1.4x + 0.3y", "yt": "corbettmaths expanding brackets", "bili": "去括号 单括号展开", "qs": [{"t": "计算题 Calculation", "qz": "展开 −3(2a + 8)。", "qe": "Expand −3(2a + 8).", "a": "−6a − 24"}, {"t": "计算题 Calculation", "qz": "化简 7x − (x − y)。", "qe": "Simplify 7x − (x − y).", "a": "6x + y"}, {"t": "计算题 Calculation", "qz": "化简 3(t − 4) − 6。", "qe": "Simplify 3(t − 4) − 6.", "a": "3t − 18"}, {"t": "选择题 MCQ", "qz": "−4(3 − x) = ? A. −12 − 4x  B. −12 + 4x  C. 12 − 4x  D. −7 + x", "qe": "−4(3 − x) = ? A. −12 − 4x  B. −12 + 4x  C. 12 − 4x  D. −7 + x", "a": "B. −12 + 4x"}]}, {"id": "u1a4", "zh": "解一元一次方程", "en": "Solving linear equations", "page": 22, "ez": "解方程时对等式两边做同样的运算（加、减、乘、除）以保持平衡。未知数在两边时，先把含 x 的项移到一边；有括号先展开。最后一定要代回检验。", "ee": "To solve equations, do the same thing to both sides. When x appears on both sides, collect x terms on one side; expand brackets first. Always check your answer by substituting back.", "terms": ["equation 方程", "solve 解", "unknown 未知数", "balance 平衡", "check 检验"], "ex": "5x + 3 = 2x + 12 ⇒ 3x = 9 ⇒ x = 3（检验：18 = 18）", "yt": "corbettmaths solving equations", "bili": "解一元一次方程 移项", "qs": [{"t": "计算题 Calculation", "qz": "解 20 − x = 5。", "qe": "Solve 20 − x = 5.", "a": "x = 15"}, {"t": "计算题 Calculation", "qz": "解 3(x − 2) = x + 8。", "qe": "Solve 3(x − 2) = x + 8.", "a": "3x − 6 = x + 8 ⇒ 2x = 14 ⇒ x = 7"}, {"t": "计算题 Calculation", "qz": "解 36/x = 3。", "qe": "Solve 36/x = 3.", "a": "x = 12"}, {"t": "应用题 Word problem", "qz": "我想一个数，乘以 4 再减 7 得 25。求这个数。", "qe": "I think of a number, multiply by 4 and subtract 7 to get 25. Find the number.", "a": "4x − 7 = 25 ⇒ x = 8"}]}]}, {"id": "u1g", "unit": "第1单元 Unit 1", "zh": "图像 1", "en": "Graphs 1", "page": 32, "kps": [{"id": "u1g1", "zh": "直线的斜率", "en": "Gradient of a straight line", "page": 33, "ez": "斜率 m = 竖直变化 / 水平变化（rise / run）= (y₂ − y₁)/(x₂ − x₁)。从左下到右上的直线斜率为正，从左上到右下为负。平行线斜率相同。一定要画图。", "ee": "Gradient m = rise / run = (y₂ − y₁)/(x₂ − x₁). Lines going up to the right have positive gradient; lines going down have negative gradient. Parallel lines have the same gradient. Always draw a diagram.", "terms": ["gradient 斜率", "rise 竖直变化", "run 水平变化", "parallel 平行"], "ex": "A(1, 3)、B(2, 6)：m = (6 − 3)/(2 − 1) = 3", "yt": "corbettmaths gradient of a line", "bili": "直线斜率 计算", "qs": [{"t": "计算题 Calculation", "qz": "A(−4, −1)，B(4, 1)，求 AB 的斜率。", "qe": "Find the gradient of AB, A(−4, −1), B(4, 1).", "a": "2/8 = 1/4"}, {"t": "计算题 Calculation", "qz": "A(−2, 2)，B(2, 1)，求斜率。", "qe": "Gradient of A(−2, 2) to B(2, 1)?", "a": "−1/4"}, {"t": "应用题 Word problem", "qz": "梯子靠墙到达 12 m 高，斜率为 4。梯子底部离墙多远？", "qe": "A ladder reaches 12 m up a wall with gradient 4. How far is its foot from the wall?", "a": "12 ÷ 4 = 3 m"}, {"t": "判断题 True/False", "qz": "两条平行直线的斜率相同。", "qe": "Parallel lines have equal gradients.", "a": "正确 True"}]}, {"id": "u1g2", "zh": "画直线图像 y = mx + c", "en": "Plotting straight-line graphs y = mx + c", "page": 37, "ez": "y = mx + c 的图像是直线，m 是斜率，c 是 y 轴截距。列值表时取三四个分布较开的点即可；若点不在一条直线上，说明值表有误。", "ee": "The graph of y = mx + c is a straight line with gradient m and y-intercept c. Use three or four widely spaced points in a table of values; if the points are not in a straight line, there is a mistake in the table.", "terms": ["y-intercept y轴截距", "table of values 值表", "plot 描点", "origin 原点"], "ex": "y = 2x − 3：x = −2, 0, 3 → y = −7, −3, 3；斜率 2，截距 −3", "yt": "corbettmaths drawing straight line graphs y=mx+c", "bili": "一次函数图像 y=kx+b 斜率 截距", "qs": [{"t": "填空题 Fill in", "qz": "y = −3x + 5 的斜率是 ____，截距是 ____。", "qe": "y = −3x + 5: gradient ____, intercept ____.", "a": "−3，5"}, {"t": "选择题 MCQ", "qz": "哪条线最陡？ A. y = 2x  B. y = −x + 1  C. y = 5x − 2  D. y = ½x", "qe": "Which line is steepest? A. y = 2x  B. y = −x + 1  C. y = 5x − 2  D. y = ½x", "a": "C. y = 5x − 2"}, {"t": "计算题 Calculation", "qz": "y = 2x − 3，当 x = 0.6 时 y = ?", "qe": "For y = 2x − 3, find y when x = 0.6.", "a": "−1.8"}, {"t": "判断题 True/False", "qz": "y = 4x 和 y = 4x − 7 是平行线。", "qe": "y = 4x and y = 4x − 7 are parallel.", "a": "正确 True"}]}, {"id": "u1g3", "zh": "ax + by = c 型直线", "en": "Graphs of ax + by = c", "page": 41, "ez": "ax + by = c 也是直线。最快的画法是找它与两坐标轴的交点：令 x = 0 求 y，令 y = 0 求 x，再连线。", "ee": "ax + by = c is a straight line. To draw it, find where it crosses the axes: put x = 0 to find y, put y = 0 to find x, then join the points.", "terms": ["intercept 截距", "axes 坐标轴", "cover-up method 遮盖法"], "ex": "3x + 2y = 12：x = 0 → y = 6；y = 0 → x = 4，交点 (0, 6)、(4, 0)", "yt": "corbettmaths drawing linear graphs cover up method", "bili": "直线与坐标轴交点 画图", "qs": [{"t": "计算题 Calculation", "qz": "2x + y = 6 与坐标轴交于何处？", "qe": "Where does 2x + y = 6 cross the axes?", "a": "(0, 6) 和 (3, 0)"}, {"t": "计算题 Calculation", "qz": "4y − 3x = 24 与坐标轴的交点？", "qe": "Where does 4y − 3x = 24 cross the axes?", "a": "(0, 6)，(−8, 0)"}, {"t": "应用题 Word problem", "qz": "植物售价 £P 与销量 N（千株）满足 6P + N = 90。售价 £8 时销量多少？", "qe": "Plant sales satisfy 6P + N = 90 (N thousand, price £P). How many are sold at £8?", "a": "N = 90 − 48 = 42，即 42 000 株"}, {"t": "判断题 True/False", "qz": "x − 2y = 4 经过点 (4, 0)。", "qe": "x − 2y = 4 passes through (4, 0).", "a": "正确 True"}]}, {"id": "u1g4", "zh": "直线换算图与实际图像", "en": "Straight-line conversion & real-life graphs", "page": 42, "ez": "换算图可以方便地把一种单位换成另一种（如货币、温度）。由于从图上读数，答案是近似值。并不是所有换算图都经过原点（如华氏–摄氏、带固定费用的电费图）。", "ee": "A conversion graph is an easy way to convert from one unit to another (currency, temperature). Readings from a graph are not exact. Not all conversion graphs pass through the origin (e.g. °F–°C, bills with a fixed charge).", "terms": ["conversion graph 换算图", "estimate 估计", "fixed charge 固定费用"], "ex": "若 €120 ≈ £87，则 €60 ≈ £43.5", "yt": "corbettmaths conversion graphs", "bili": "换算图 实际问题 一次函数", "qs": [{"t": "应用题 Word problem", "qz": "€100 = ¥13 000（直线过原点）。Adam 用 €100 买 ¥6000 的相机，应找回多少日元？", "qe": "€100 = ¥13 000 (through origin). Adam pays €100 for a ¥6000 camera. Change in yen?", "a": "¥7000"}, {"t": "判断题 True/False", "qz": "华氏-摄氏换算图经过原点。", "qe": "The °F–°C conversion graph passes through the origin.", "a": "错误 False（0°C = 32°F）"}, {"t": "计算题 Calculation", "qz": "电费 = 10 + 0.2 × 度数（美元）。用 150 度多少钱？", "qe": "Cost = 10 + 0.2 × units ($). Cost for 150 units?", "a": "$40"}, {"t": "选择题 MCQ", "qz": "从图上读出的换算结果是： A. 精确值 B. 近似值", "qe": "Readings from a conversion graph are: A. exact B. approximate", "a": "B. 近似值 approximate"}]}]}, {"id": "u1s", "unit": "第1单元 Unit 1", "zh": "形与空间 1", "en": "Shape and Space 1", "page": 50, "kps": [{"id": "u1s1", "zh": "三角形的角", "en": "Triangles: angle facts", "page": 51, "ez": "三角形内角和为 180°；外角和为 360°。三角形的一个外角等于不相邻两内角之和。等边三角形也是等腰三角形；等腰三角形可分成两个全等直角三角形。解题时把算出的角标在草图上，并写出理由。", "ee": "The angle sum of a triangle is 180°; the exterior angles sum to 360°. An exterior angle equals the sum of the two opposite interior angles. An equilateral triangle is also isosceles; an isosceles triangle splits into two equal right-angled triangles. Mark angles on a sketch and give reasons.", "terms": ["interior angle 内角", "exterior angle 外角", "isosceles 等腰", "equilateral 等边", "alternate angles 内错角", "corresponding angles 同位角"], "ex": "两内角 50° 和 65°，第三角 = 65°，此外角 = 50° + 65° = 115°", "yt": "corbettmaths angles in a triangle exterior angle", "bili": "三角形内角和 外角定理", "qs": [{"t": "计算题 Calculation", "qz": "三角形两角为 47° 和 68°，求第三个角。", "qe": "A triangle has angles 47° and 68°. Find the third.", "a": "65°"}, {"t": "计算题 Calculation", "qz": "等腰三角形顶角 40°，求底角。", "qe": "An isosceles triangle has apex angle 40°. Find a base angle.", "a": "(180 − 40)/2 = 70°"}, {"t": "判断题 True/False", "qz": "三角形外角等于不相邻的两个内角之和。", "qe": "An exterior angle of a triangle equals the sum of the two opposite interior angles.", "a": "正确 True"}, {"t": "选择题 MCQ", "qz": "三角形外角和为？ A. 180°  B. 270°  C. 360°  D. 540°", "qe": "Exterior angles of a triangle sum to? A. 180° B. 270° C. 360° D. 540°", "a": "C. 360°"}]}, {"id": "u1s2", "zh": "四边形", "en": "Quadrilaterals", "page": 57, "ez": "四边形内角和为 360°（可分成两个三角形）。特殊四边形：正方形、长方形、平行四边形、菱形、梯形、筝形，各有不同的边、角、对角线、对称轴和旋转对称性质。如平行四边形对角相等、邻角互补。", "ee": "The interior angles of a quadrilateral sum to 360° (two triangles). Special quadrilaterals – square, rectangle, parallelogram, rhombus, trapezium, kite – have different properties of sides, angles, diagonals, lines of symmetry and rotational symmetry. E.g. a parallelogram has equal opposite angles and co-interior angles summing to 180°.", "terms": ["parallelogram 平行四边形", "rhombus 菱形", "trapezium 梯形", "kite 筝形", "diagonal 对角线", "rotational symmetry 旋转对称"], "ex": "平行四边形一角 64°，其余为 116°、64°、116°", "yt": "corbettmaths properties of quadrilaterals", "bili": "四边形性质 平行四边形 菱形 筝形", "qs": [{"t": "计算题 Calculation", "qz": "四边形三个角为 85°、95°、110°，求第四角。", "qe": "A quadrilateral has angles 85°, 95°, 110°. Find the fourth.", "a": "70°"}, {"t": "选择题 MCQ", "qz": "只有一条对称轴、没有旋转对称的四边形是？ A. 正方形 B. 筝形 C. 平行四边形 D. 长方形", "qe": "A quadrilateral with one line of symmetry and no rotational symmetry? A. square B. kite C. parallelogram D. rectangle", "a": "B. 筝形 kite（等腰梯形也可）"}, {"t": "判断题 True/False", "qz": "菱形的对角线互相垂直平分。", "qe": "The diagonals of a rhombus bisect each other at right angles.", "a": "正确 True"}, {"t": "判断题 True/False", "qz": "平行四边形一定有对称轴。", "qe": "A parallelogram always has a line of symmetry.", "a": "错误 False"}]}, {"id": "u1s3", "zh": "多边形的内角与外角", "en": "Polygons: interior & exterior angles", "page": 61, "ez": "n 边形可分成 (n − 2) 个三角形，内角和 = (n − 2) × 180°。任何多边形外角和都是 360°。正多边形：每个外角 = 360°/n，每个内角 = 180° − 360°/n。正多边形可分成全等的等腰三角形。", "ee": "An n-sided polygon divides into n − 2 triangles, so the interior angles sum to (n − 2) × 180°. Exterior angles of any polygon sum to 360°. For a regular polygon, exterior angle = 360°/n and interior angle = 180° − 360°/n.", "terms": ["polygon 多边形", "regular polygon 正多边形", "pentagon 五边形", "hexagon 六边形", "octagon 八边形"], "ex": "正五边形：外角 = 360/5 = 72°，内角 = 108°", "yt": "corbettmaths interior and exterior angles of polygons", "bili": "多边形内角和 外角和 正多边形", "qs": [{"t": "计算题 Calculation", "qz": "八边形的内角和是多少？", "qe": "Sum of interior angles of an octagon?", "a": "6 × 180 = 1080°"}, {"t": "计算题 Calculation", "qz": "正多边形外角为 24°，它有几条边？", "qe": "A regular polygon has exterior angle 24°. How many sides?", "a": "360/24 = 15"}, {"t": "计算题 Calculation", "qz": "正六边形每个内角？", "qe": "Each interior angle of a regular hexagon?", "a": "120°"}, {"t": "判断题 True/False", "qz": "十边形的外角和比五边形大。", "qe": "A decagon's exterior angles sum to more than a pentagon's.", "a": "错误 False（都是 360°）"}]}, {"id": "u1s4", "zh": "方位角与比例图", "en": "Bearings & scale drawings", "page": 65, "ez": "方位角从北方开始顺时针测量，用三位数表示（如 060°）。若 B 在 A 的 120° 方位，则 A 在 B 的 300° 方位（相差 180°）。地图比例尺 1 : 50 000 表示图上 1 cm 代表实际 50 000 cm = 0.5 km。", "ee": "Bearings are measured clockwise from north and written with three figures (e.g. 060°). If B is on a bearing of 120° from A, then A is on 300° from B (differ by 180°). A map scale 1 : 50 000 means 1 cm represents 50 000 cm = 0.5 km.", "terms": ["bearing 方位角", "clockwise 顺时针", "scale 比例尺", "scale drawing 比例图"], "ex": "1 : 50 000 地图上 6 cm → 300 000 cm = 3 km", "yt": "corbettmaths bearings scale drawings", "bili": "方位角 比例尺", "qs": [{"t": "计算题 Calculation", "qz": "B 在 A 的方位 075°，求 A 在 B 的方位。", "qe": "B is on bearing 075° from A. Find the bearing of A from B.", "a": "255°"}, {"t": "计算题 Calculation", "qz": "比例尺 1 cm : 10 km，实际 25 km 在图上多长？", "qe": "Scale 1 cm : 10 km. Map length for 25 km?", "a": "2.5 cm"}, {"t": "计算题 Calculation", "qz": "1 : 25 000 地图上 8 cm 代表多少 km？", "qe": "On a 1 : 25 000 map, what does 8 cm represent in km?", "a": "200 000 cm = 2 km"}, {"t": "选择题 MCQ", "qz": "正西方向的方位角是？ A. 090°  B. 180°  C. 270°  D. 360°", "qe": "Bearing of due west? A. 090° B. 180° C. 270° D. 360°", "a": "C. 270°"}]}, {"id": "u1s5", "zh": "尺规作图", "en": "Constructions", "page": 68, "ez": "只用直尺和圆规作图：①已知三边作三角形（SSS），也可用量角器作 SAS、ASA；②线段的垂直平分线（到两端点距离相等的点的集合）；③角平分线（到角两边距离相等）。保留作图痕迹（弧线）。", "ee": "Use ruler and compasses to: construct triangles from three sides (SSS) – or with a protractor SAS/ASA; construct the perpendicular bisector of a line segment (points equidistant from the two ends); bisect an angle (points equidistant from the two arms). Leave construction arcs visible.", "terms": ["compasses 圆规", "perpendicular bisector 垂直平分线", "angle bisector 角平分线", "construction arcs 作图弧", "locus 轨迹"], "ex": "作 AB 的垂直平分线：以 A、B 为圆心、大于 AB/2 为半径画弧，两交点连线", "yt": "corbettmaths perpendicular bisector angle bisector construction", "bili": "尺规作图 垂直平分线 角平分线", "qs": [{"t": "判断题 True/False", "qz": "垂直平分线上的点到线段两端点的距离相等。", "qe": "Points on the perpendicular bisector are equidistant from both ends of the segment.", "a": "正确 True"}, {"t": "选择题 MCQ", "qz": "只给出三边长，作三角形需要： A. 量角器 B. 圆规和直尺 C. 只要直尺", "qe": "Given only three side lengths, to construct a triangle you need: A. protractor B. compasses & ruler C. ruler only", "a": "B"}, {"t": "填空题 Fill in", "qz": "到角两边距离相等的点在角的 ____ 上。", "qe": "Points equidistant from the arms of an angle lie on the angle ____.", "a": "平分线 bisector"}, {"t": "应用题 Word problem", "qz": "两棵树相距 8 m，要在离两树等距处装灯，灯可能在哪？", "qe": "Two trees are 8 m apart. Where can a lamp be placed equidistant from both?", "a": "两树连线的垂直平分线上任意点 on the perpendicular bisector"}]}, {"id": "u1s6", "zh": "相似三角形", "en": "Similar triangles", "page": 73, "ez": "相似三角形形状相同、大小可不同：对应角相等，对应边成比例（同一比例因子 k）。求未知边：找出对应边，写比例式 a/A = b/B。比例尺图和地图本质上就是相似。", "ee": "Similar triangles have the same shape: corresponding angles are equal and corresponding sides are in the same ratio (scale factor k). To find a missing side, match corresponding sides and use a/A = b/B.", "terms": ["similar 相似", "corresponding sides 对应边", "scale factor 比例因子", "ratio 比"], "ex": "小三角形边 3, 4；大三角形对应边 6, x ⇒ k = 2，x = 8", "yt": "corbettmaths similar shapes lengths", "bili": "相似三角形 对应边成比例", "qs": [{"t": "计算题 Calculation", "qz": "两相似三角形对应边 5 cm 和 15 cm，小三角形另一边 4 cm，大三角形对应边？", "qe": "Similar triangles: corresponding sides 5 cm and 15 cm. Another side of the small one is 4 cm. Corresponding big side?", "a": "k = 3，12 cm"}, {"t": "应用题 Word problem", "qz": "1.8 m 高的人影长 2.4 m，同时树影长 12 m，树多高？", "qe": "A 1.8 m person casts a 2.4 m shadow; a tree casts 12 m. Tree height?", "a": "1.8 × 12/2.4 = 9 m"}, {"t": "判断题 True/False", "qz": "所有等边三角形都相似。", "qe": "All equilateral triangles are similar.", "a": "正确 True"}, {"t": "判断题 True/False", "qz": "对应角相等的三角形一定全等。", "qe": "Triangles with equal angles must be congruent.", "a": "错误 False（只是相似 only similar）"}]}]}, {"id": "u1t", "unit": "第1单元 Unit 1", "zh": "集合 1", "en": "Sets 1", "page": 84, "kps": [{"id": "u1t1", "zh": "集合符号", "en": "Set notation", "page": 84, "ez": "集合是一组对象，可用列举或规则描述，如 A = {1, 3, 5}。每个对象是元素：1 ∈ A，2 ∉ A。元素完全相同的集合相等（与顺序无关）。n(A) 表示 A 的元素个数。空集记作 {} 或 ∅。", "ee": "A set is a collection of objects described by a list or a rule, e.g. A = {1, 3, 5}. Each object is an element (member): 1 ∈ A, 2 ∉ A. Sets are equal if they have exactly the same elements. n(A) is the number of elements. The empty set is {} or ∅.", "terms": ["set 集合", "element 元素", "∈ 属于", "∉ 不属于", "empty set 空集", "n(A) 元素个数"], "ex": "A = {小于 22 的质数} = {2, 3, 5, 7, 11, 13, 17, 19}，n(A) = 8", "yt": "corbettmaths set notation", "bili": "集合 元素 符号 空集", "qs": [{"t": "填空题 Fill in", "qz": "B = {101 以内的平方数}，n(B) = ____", "qe": "B = {square numbers less than 101}, n(B) = ____", "a": "10（1, 4, …, 100）"}, {"t": "判断题 True/False", "qz": "{5, 3, 1} = {1, 3, 5}", "qe": "{5, 3, 1} = {1, 3, 5}", "a": "正确 True"}, {"t": "选择题 MCQ", "qz": "下列哪个是空集？ A. {0}  B. {偶质数}  C. {大于 10 小于 11 的整数}", "qe": "Which is empty? A. {0} B. {even primes} C. {integers between 10 and 11}", "a": "C"}, {"t": "填空题 Fill in", "qz": "若 A = {a, b, c}，则 d ___ A。", "qe": "If A = {a, b, c}, then d ___ A.", "a": "∉"}]}, {"id": "u1t2", "zh": "韦恩图：全集、子集、补集、交集、并集", "en": "Venn diagrams: universal set, subset, complement, ∩, ∪", "page": 87, "ez": "全集 ℰ 包含问题中所有元素。B ⊂ A 表示 B 的每个元素都在 A 中。交集 A ∩ B：同时在 A 和 B 中的元素；并集 A ∪ B：在 A 或 B（或两者）中的元素；补集 A′：不在 A 中的元素。韦恩图可用于解决计数问题。", "ee": "The universal set ℰ contains all elements being considered. B ⊂ A if every member of B is in A. Intersection A ∩ B: elements in both; union A ∪ B: elements in A or B or both; complement A′: elements not in A. Venn diagrams help solve counting problems.", "terms": ["universal set 全集", "subset 子集", "intersection 交集", "union 并集", "complement 补集", "Venn diagram 韦恩图"], "ex": "ℰ = {1,…,10}，A = {偶数}，B = {3 的倍数}：A ∩ B = {6}，A ∪ B = {2,3,4,6,8,9,10}", "yt": "corbettmaths venn diagrams sets intersection union", "bili": "韦恩图 交集 并集 补集", "qs": [{"t": "计算题 Calculation", "qz": "A = {1,2,3,4}，B = {3,4,5}，求 A ∩ B 与 A ∪ B。", "qe": "A = {1,2,3,4}, B = {3,4,5}. Find A ∩ B and A ∪ B.", "a": "{3,4}；{1,2,3,4,5}"}, {"t": "应用题 Word problem", "qz": "班上 30 人，18 人喜欢巧克力，15 人喜欢糖果，7 人两者都喜欢。几人都不喜欢？", "qe": "30 pupils: 18 like chocolate, 15 like sweets, 7 like both. How many like neither?", "a": "30 − (18 + 15 − 7) = 4"}, {"t": "计算题 Calculation", "qz": "ℰ = {1,…,8}，A = {1,3,5,7}，求 A′。", "qe": "ℰ = {1,…,8}, A = {1,3,5,7}. Find A′.", "a": "{2,4,6,8}"}, {"t": "判断题 True/False", "qz": "若 B ⊂ A，则 A ∩ B = B。", "qe": "If B ⊂ A then A ∩ B = B.", "a": "正确 True"}]}]}, {"id": "u2n", "unit": "第2单元 Unit 2", "zh": "数 2", "en": "Number 2", "page": 97, "kps": [{"id": "u2n1", "zh": "科学记数法（正指数）", "en": "Standard form – positive indices", "page": 97, "ez": "科学记数法写成 a × 10ⁿ，其中 1 ≤ a < 10，n 为整数。大数用正指数：45 000 = 4.5 × 10⁴。计算时可分别处理 a 部分与 10 的幂（同底数幂相乘指数相加）。", "ee": "Standard form is a × 10ⁿ where 1 ≤ a < 10 and n is an integer. Large numbers have positive n: 45 000 = 4.5 × 10⁴. When calculating, deal with the number parts and powers of 10 separately.", "terms": ["standard form 科学记数法", "index / power 指数", "order of magnitude 数量级"], "ex": "(3 × 10⁴) × (4 × 10⁵) = 12 × 10⁹ = 1.2 × 10¹⁰", "yt": "corbettmaths standard form", "bili": "科学记数法 标准形式", "qs": [{"t": "计算题 Calculation", "qz": "把 93 000 000 写成科学记数法。", "qe": "Write 93 000 000 in standard form.", "a": "9.3 × 10⁷"}, {"t": "计算题 Calculation", "qz": "(2.5 × 10³) × (4 × 10⁶) = ?", "qe": "(2.5 × 10³) × (4 × 10⁶) = ?", "a": "1 × 10¹⁰"}, {"t": "判断题 True/False", "qz": "12 × 10⁵ 是标准的科学记数法。", "qe": "12 × 10⁵ is in standard form.", "a": "错误 False，应为 1.2 × 10⁶"}, {"t": "计算题 Calculation", "qz": "(8 × 10⁹) ÷ (2 × 10³) = ?", "qe": "(8 × 10⁹) ÷ (2 × 10³) = ?", "a": "4 × 10⁶"}]}, {"id": "u2n2", "zh": "科学记数法（负指数）", "en": "Standard form – negative indices", "page": 100, "ez": "小于 1 的数用负指数：0.00056 = 5.6 × 10⁻⁴。10⁻ⁿ = 1/10ⁿ。n 的绝对值是小数点向右移动的位数。", "ee": "Numbers less than 1 have negative indices: 0.00056 = 5.6 × 10⁻⁴. 10⁻ⁿ = 1/10ⁿ. The size of n tells how many places the decimal point moves to the right.", "terms": ["negative index 负指数", "small numbers 小数"], "ex": "3.2 × 10⁻³ = 0.0032", "yt": "corbettmaths standard form small numbers negative powers", "bili": "科学记数法 负指数 小数", "qs": [{"t": "计算题 Calculation", "qz": "把 0.000 07 写成科学记数法。", "qe": "Write 0.000 07 in standard form.", "a": "7 × 10⁻⁵"}, {"t": "计算题 Calculation", "qz": "把 4.06 × 10⁻² 写成普通数。", "qe": "Write 4.06 × 10⁻² as an ordinary number.", "a": "0.0406"}, {"t": "计算题 Calculation", "qz": "(6 × 10⁻³) × (5 × 10⁻²) = ?", "qe": "(6 × 10⁻³) × (5 × 10⁻²) = ?", "a": "30 × 10⁻⁵ = 3 × 10⁻⁴"}, {"t": "选择题 MCQ", "qz": "哪个最小？ A. 2 × 10⁻³  B. 9 × 10⁻⁴  C. 1 × 10⁻²", "qe": "Which is smallest? A. 2 × 10⁻³ B. 9 × 10⁻⁴ C. 1 × 10⁻²", "a": "B"}]}, {"id": "u2n3", "zh": "百分数与百分比变化", "en": "Percentages & percentage change", "page": 103, "ez": "百分数表示“每一百中的份数”。求一个量是另一个量的百分之几：(部分 ÷ 整体) × 100%。百分比变化 = (变化量 ÷ 原值) × 100%，增加为正、减少为负。注意除以的是原值。", "ee": "A percentage is a number of parts per hundred. To express one quantity as a percentage of another: (part ÷ whole) × 100%. Percentage change = (change ÷ original value) × 100%. Always divide by the original value.", "terms": ["percentage 百分数", "percentage change 百分比变化", "profit 利润", "loss 亏损", "original value 原值"], "ex": "价格从 $80 涨到 $92：变化 12，12/80 × 100% = 15%", "yt": "corbettmaths percentage change", "bili": "百分比变化 增长率", "qs": [{"t": "计算题 Calculation", "qz": "求 45 的 30%。", "qe": "Find 30% of 45.", "a": "13.5"}, {"t": "计算题 Calculation", "qz": "18 占 72 的百分之几？", "qe": "Express 18 as a percentage of 72.", "a": "25%"}, {"t": "应用题 Word problem", "qz": "手机原价 $250，现价 $210，下降百分之几？", "qe": "A phone falls from $250 to $210. Percentage decrease?", "a": "40/250 = 16%"}, {"t": "判断题 True/False", "qz": "从 50 增加到 60 和从 60 减少到 50 的百分比相同。", "qe": "50→60 and 60→50 are the same percentage change.", "a": "错误 False（+20% vs −16.7%）"}]}, {"id": "u2n4", "zh": "百分比增减与乘数", "en": "Percentage increase & decrease (multipliers)", "page": 106, "ez": "增加 R%：乘以 (1 + R/100)；减少 R%：乘以 (1 − R/100)。如 +25% → ×1.25，−25% → ×0.75。升值（appreciation/inflation）与贬值（depreciation/deflation）都可以用乘数计算。", "ee": "To increase a quantity by R%, multiply by 1 + R/100; to decrease by R%, multiply by 1 − R/100. E.g. +25% → ×1.25, −25% → ×0.75. Appreciation (inflation) and depreciation (deflation) use multipliers.", "terms": ["multiplying factor 乘数", "appreciation 升值", "depreciation 贬值", "inflation 通胀"], "ex": "€360 增加 15%：360 × 1.15 = €414", "yt": "corbettmaths percentage increase decrease multiplier", "bili": "百分比增减 乘数", "qs": [{"t": "选择题 MCQ", "qz": "减少 8% 的乘数是？ A. 0.8  B. 0.92  C. 1.08  D. 0.08", "qe": "Multiplier for an 8% decrease? A. 0.8 B. 0.92 C. 1.08 D. 0.08", "a": "B. 0.92"}, {"t": "计算题 Calculation", "qz": "$640 增加 35%。", "qe": "Increase $640 by 35%.", "a": "640 × 1.35 = $864"}, {"t": "应用题 Word problem", "qz": "汽车 £12 000 贬值 18%，现值？", "qe": "A £12 000 car depreciates by 18%. New value?", "a": "£9840"}, {"t": "填空题 Fill in", "qz": "乘数 1.075 表示增加 ____%。", "qe": "Multiplier 1.075 means an increase of ____%.", "a": "7.5"}]}]}, {"id": "u2a", "unit": "第2单元 Unit 2", "zh": "代数 2", "en": "Algebra 2", "page": 113, "kps": [{"id": "u2a1", "zh": "化简代数分式", "en": "Simplifying algebraic fractions", "page": 113, "ez": "代数分式和数字分式规则相同：乘除时先约去公因式（除法要翻转第二个分数）；加减时先通分。只能约去整个因式，不能约去被加减的项。", "ee": "Algebraic fractions follow the same rules as number fractions: when multiplying or dividing, cancel common factors (flip the second fraction for division); when adding or subtracting, use a common denominator. Only cancel whole factors, never terms that are added.", "terms": ["algebraic fraction 代数分式", "common factor 公因式", "common denominator 公分母"], "ex": "x/3 + x/4 = 4x/12 + 3x/12 = 7x/12；  (2a/b) ÷ (4a²/b²) = b/(2a)", "yt": "corbettmaths algebraic fractions adding", "bili": "代数分式 通分 约分", "qs": [{"t": "计算题 Calculation", "qz": "化简 6x²y / 3xy。", "qe": "Simplify 6x²y / 3xy.", "a": "2x"}, {"t": "计算题 Calculation", "qz": "x/2 − x/5 = ?", "qe": "x/2 − x/5 = ?", "a": "3x/10"}, {"t": "计算题 Calculation", "qz": "(a/3) × (6/a²) = ?", "qe": "(a/3) × (6/a²) = ?", "a": "2/a"}, {"t": "判断题 True/False", "qz": "(x + 3)/3 = x。", "qe": "(x + 3)/3 = x.", "a": "错误 False，不能约去加项"}]}, {"id": "u2a2", "zh": "含根号与乘方的方程", "en": "Solving equations with roots & powers", "page": 116, "ez": "x² = k 有两个解：x = ±√k（k > 0）。含 √x 的方程两边平方。先把含 x² 或 √x 的项单独放到一边，再开方或平方。注意实际问题中可能只取正值。", "ee": "x² = k has two solutions x = ±√k (for k > 0). For equations with √x, square both sides. First isolate the x² or √x term, then take the root or square. In real contexts only the positive value may make sense.", "terms": ["square root 平方根", "±（plus or minus） 正负", "isolate 分离"], "ex": "3x² − 5 = 70 ⇒ x² = 25 ⇒ x = ±5；  √x + 2 = 7 ⇒ x = 25", "yt": "corbettmaths solving equations with squares square roots", "bili": "含平方 根号的方程", "qs": [{"t": "计算题 Calculation", "qz": "解 2x² = 72。", "qe": "Solve 2x² = 72.", "a": "x = ±6"}, {"t": "计算题 Calculation", "qz": "解 √(x − 1) = 4。", "qe": "Solve √(x − 1) = 4.", "a": "x = 17"}, {"t": "计算题 Calculation", "qz": "解 x³ = −64。", "qe": "Solve x³ = −64.", "a": "x = −4"}, {"t": "应用题 Word problem", "qz": "正方形面积 49 cm²，边长？", "qe": "A square has area 49 cm². Side length?", "a": "7 cm（负值舍去）"}]}, {"id": "u2a3", "zh": "正整数指数（幂的运算）", "en": "Positive integer indices", "page": 118, "ez": "同底数幂相乘，指数相加：aᵐ × aⁿ = aᵐ⁺ⁿ；相除，指数相减：aᵐ ÷ aⁿ = aᵐ⁻ⁿ；幂的乘方，指数相乘：(aᵐ)ⁿ = aᵐⁿ。", "ee": "Multiplying: add the indices, aᵐ × aⁿ = aᵐ⁺ⁿ. Dividing: subtract, aᵐ ÷ aⁿ = aᵐ⁻ⁿ. Raising to a power: multiply, (aᵐ)ⁿ = aᵐⁿ.", "terms": ["index law 指数法则", "base 底数", "power 幂"], "ex": "6³ × 6⁴ = 6⁷ = 279 936；9⁵ ÷ 9² = 9³ = 729；(4²)⁵ = 4¹⁰", "yt": "corbettmaths laws of indices", "bili": "幂的运算 指数法则", "qs": [{"t": "计算题 Calculation", "qz": "化简 x⁵ × x³。", "qe": "Simplify x⁵ × x³.", "a": "x⁸"}, {"t": "计算题 Calculation", "qz": "化简 (2a³)²。", "qe": "Simplify (2a³)².", "a": "4a⁶"}, {"t": "计算题 Calculation", "qz": "化简 12y⁷ ÷ 4y²。", "qe": "Simplify 12y⁷ ÷ 4y².", "a": "3y⁵"}, {"t": "选择题 MCQ", "qz": "(x²)³ × x = ? A. x⁶  B. x⁷  C. x⁹  D. x⁵", "qe": "(x²)³ × x = ? A. x⁶ B. x⁷ C. x⁹ D. x⁵", "a": "B. x⁷"}]}, {"id": "u2a4", "zh": "不等式", "en": "Inequalities", "page": 119, "ez": "x > 4 表示 x 不能等于 4；x ≥ 4 表示 x 可以等于 4。在数轴上：空心圆表示不含端点，实心圆表示含端点。解不等式与解方程类似，但两边乘或除以负数时要改变不等号方向。整数解要列出满足条件的整数。", "ee": "x > 4 means x cannot equal 4; x ≥ 4 means x can equal 4. On a number line use an open circle (not included) or filled circle (included). Solve like equations, but reverse the inequality sign when multiplying or dividing by a negative number.", "terms": ["inequality 不等式", "solution set 解集", "number line 数轴", "integer 整数"], "ex": "5 − 2x < 11 ⇒ −2x < 6 ⇒ x > −3", "yt": "corbettmaths solving inequalities", "bili": "解不等式 不等号变向", "qs": [{"t": "计算题 Calculation", "qz": "解 3x − 3 > 12。", "qe": "Solve 3x − 3 > 12.", "a": "x > 5"}, {"t": "计算题 Calculation", "qz": "解 4 − x ≥ 7。", "qe": "Solve 4 − x ≥ 7.", "a": "x ≤ −3"}, {"t": "填空题 Fill in", "qz": "满足 −2 < x ≤ 3 的整数有 ____。", "qe": "Integers satisfying −2 < x ≤ 3: ____", "a": "−1, 0, 1, 2, 3"}, {"t": "判断题 True/False", "qz": "两边同乘 −1，不等号方向不变。", "qe": "Multiplying both sides by −1 keeps the inequality sign.", "a": "错误 False"}]}]}, {"id": "u2g", "unit": "第2单元 Unit 2", "zh": "图像 2", "en": "Graphs 2", "page": 126, "kps": [{"id": "u2g1", "zh": "求直线方程", "en": "Finding the equation of a straight line", "page": 126, "ez": "若斜率为 m，方程为 y = mx + c。求 c：把直线上一点代入。过原点则 c = 0，y = mx。已知两点：先求斜率，再代入一点求 c。", "ee": "If the gradient is m, the equation is y = mx + c. To find c, substitute a point on the line. If the line passes through the origin, c = 0 so y = mx. Given two points, find the gradient first, then c.", "terms": ["equation of a line 直线方程", "substitute 代入"], "ex": "过 (2, 3)，斜率 1：3 = 2 + c ⇒ c = 1，y = x + 1", "yt": "corbettmaths equation of a straight line two points", "bili": "求直线方程 两点式", "qs": [{"t": "计算题 Calculation", "qz": "斜率 −2，过 (0, 3)，求方程。", "qe": "Gradient −2 through (0, 3).", "a": "y = −2x + 3"}, {"t": "计算题 Calculation", "qz": "过 A(1, 2) 和 B(3, 4) 的直线方程。", "qe": "Line through A(1, 2) and B(3, 4).", "a": "m = 1，y = x + 1"}, {"t": "计算题 Calculation", "qz": "过 A(−1, 5) 和 B(3, 1)。", "qe": "Line through A(−1, 5) and B(3, 1).", "a": "m = −1，y = −x + 4"}, {"t": "判断题 True/False", "qz": "过 (0,0) 和 (6, 2) 的直线是 y = x/3。", "qe": "The line through (0,0) and (6,2) is y = x/3.", "a": "正确 True"}]}, {"id": "u2g2", "zh": "画直线草图", "en": "Sketching straight-line graphs", "page": 128, "ez": "草图大致按比例画，不需要描点。y = mx + c 用斜率和截距画；ax + by = c 用与两轴交点画。标出关键点（截距）。", "ee": "A sketch is drawn roughly to scale, not plotted. Use gradient and intercept to sketch y = mx + c; use the axis intercepts to sketch ax + by = c. Label key points.", "terms": ["sketch 草图", "intercept 截距"], "ex": "2x − 3y = 6：交 x 轴 (3, 0)，交 y 轴 (0, −2)", "yt": "sketching straight line graphs gcse", "bili": "一次函数草图", "qs": [{"t": "填空题 Fill in", "qz": "y = 3x + 5 的斜率 ____，截距 ____。", "qe": "y = 3x + 5: gradient ____, intercept ____.", "a": "3，5"}, {"t": "计算题 Calculation", "qz": "把 2y = 4x − 6 写成 y = mx + c。", "qe": "Write 2y = 4x − 6 as y = mx + c.", "a": "y = 2x − 3"}, {"t": "计算题 Calculation", "qz": "5x + 2y = 10 与两轴交点？", "qe": "Axis intercepts of 5x + 2y = 10?", "a": "(2, 0)，(0, 5)"}, {"t": "判断题 True/False", "qz": "草图需要精确描点。", "qe": "A sketch must be accurately plotted.", "a": "错误 False"}]}, {"id": "u2g3", "zh": "用图像解联立方程", "en": "Solving simultaneous equations graphically", "page": 130, "ez": "在同一坐标系中画两条直线，交点坐标即为联立方程的解。直线只需三个点。若两线平行（不相交）则无解；若两线重合则有无穷多解。", "ee": "Draw both graphs on the same axes; the solution is where they intersect. Plot only three points per straight line. If the lines are parallel (no intersection) there is no solution; if they are the same line there are infinitely many.", "terms": ["simultaneous equations 联立方程", "intersection 交点", "infinite solutions 无穷多解"], "ex": "y = x + 1 与 y = 2x − 2 交于 (3, 4) ⇒ x = 3，y = 4", "yt": "corbettmaths simultaneous equations graphically", "bili": "图像法解二元一次方程组", "qs": [{"t": "计算题 Calculation", "qz": "y = 3x − 1 与 y = 2x + 1 的交点？", "qe": "Intersection of y = 3x − 1 and y = 2x + 1?", "a": "(2, 5)"}, {"t": "选择题 MCQ", "qz": "y = 2x + 1 与 y = 2x − 3 的解有？ A. 一个 B. 无 C. 无穷多", "qe": "How many solutions: y = 2x + 1 and y = 2x − 3? A. one B. none C. infinitely many", "a": "B. 无解（平行）"}, {"t": "计算题 Calculation", "qz": "x + y = 6 与 y = x 的交点？", "qe": "Intersection of x + y = 6 and y = x?", "a": "(3, 3)"}, {"t": "判断题 True/False", "qz": "y = 2x + 4 和 2y = 4x + 8 有无穷多解。", "qe": "y = 2x + 4 and 2y = 4x + 8 have infinitely many solutions.", "a": "正确 True（同一直线）"}]}]}, {"id": "u2s", "unit": "第2单元 Unit 2", "zh": "形与空间 2", "en": "Shape and Space 2", "page": 137, "kps": [{"id": "u2s1", "zh": "勾股定理", "en": "Pythagoras' Theorem", "page": 137, "ez": "直角三角形中，斜边（直角对边，最长边）的平方等于两直角边平方和：a² + b² = c²。求斜边：c = √(a² + b²)；求直角边：a = √(c² − b²)。常用勾股数：3-4-5、5-12-13、8-15-17。逆定理可判断是否为直角三角形。", "ee": "In a right-angled triangle, the square on the hypotenuse equals the sum of the squares on the other two sides: a² + b² = c². To find the hypotenuse c = √(a² + b²); to find a shorter side a = √(c² − b²). Pythagorean triples: 3-4-5, 5-12-13, 8-15-17.", "terms": ["hypotenuse 斜边", "right angle 直角", "Pythagorean triple 勾股数"], "ex": "直角边 6 和 8：c = √(36 + 64) = 10", "yt": "corbettmaths pythagoras", "bili": "勾股定理 直角三角形", "qs": [{"t": "计算题 Calculation", "qz": "直角边 5 cm 和 12 cm，求斜边。", "qe": "Shorter sides 5 cm and 12 cm. Hypotenuse?", "a": "13 cm"}, {"t": "计算题 Calculation", "qz": "斜边 10，一直角边 7，求另一边（3 s.f.）。", "qe": "Hypotenuse 10, one side 7. Find the other (3 s.f.).", "a": "√51 ≈ 7.14"}, {"t": "应用题 Word problem", "qz": "5 m 梯子靠墙，底部离墙 1.5 m，顶部多高？", "qe": "A 5 m ladder's foot is 1.5 m from a wall. How high does it reach?", "a": "√(25 − 2.25) ≈ 4.77 m"}, {"t": "判断题 True/False", "qz": "边长 7, 24, 25 的三角形是直角三角形。", "qe": "A triangle with sides 7, 24, 25 is right-angled.", "a": "正确 True（49 + 576 = 625）"}]}, {"id": "u2s2", "zh": "圆的定理①：半圆、切线、圆心角", "en": "Circle theorems ①: semicircle, tangents, angle at centre", "page": 140, "ez": "①直径所对的圆周角是 90°（半圆上的角）。②切线与过切点的半径垂直。③从圆外一点引的两条切线长相等。④同弧所对的圆心角是圆周角的 2 倍。", "ee": "① The angle in a semicircle is 90°. ② A tangent is perpendicular to the radius at the point of contact. ③ Two tangents from an external point are equal in length. ④ The angle at the centre is twice the angle at the circumference subtended by the same arc.", "terms": ["tangent 切线", "radius 半径", "diameter 直径", "circumference 圆周", "subtend 所对", "arc 弧"], "ex": "圆周角 35°，同弧所对的圆心角 = 70°", "yt": "corbettmaths circle theorems", "bili": "圆的定理 圆周角 切线", "qs": [{"t": "计算题 Calculation", "qz": "圆心角 130°，同弧所对圆周角？", "qe": "Angle at the centre 130°. Angle at circumference on the same arc?", "a": "65°"}, {"t": "计算题 Calculation", "qz": "AB 为直径，C 在圆上，∠CAB = 28°，求 ∠ABC。", "qe": "AB is a diameter, C on the circle, ∠CAB = 28°. Find ∠ABC.", "a": "∠ACB = 90°，∠ABC = 62°"}, {"t": "判断题 True/False", "qz": "切线与半径在切点处垂直。", "qe": "A tangent meets the radius at 90° at the point of contact.", "a": "正确 True"}, {"t": "计算题 Calculation", "qz": "从 P 引两条切线 PA、PB，∠APB = 50°，O 为圆心，求 ∠AOB。", "qe": "Tangents PA, PB from P; ∠APB = 50°. Find ∠AOB.", "a": "360 − 90 − 90 − 50 = 130°"}]}, {"id": "u2s3", "zh": "圆的定理②：同弧圆周角、圆内接四边形与推理书写", "en": "Circle theorems ②: same segment, cyclic quadrilateral & giving reasons", "page": 144, "ez": "⑤同一弓形中的圆周角相等。⑥圆内接四边形对角互补（和为 180°）。几何题每一步都要写理由，常用理由：平角 180°、周角 360°、三角形内角和 180°、内错角相等、等腰三角形底角相等、对顶角相等。", "ee": "⑤ Angles in the same segment are equal. ⑥ Opposite angles of a cyclic quadrilateral sum to 180°. Every step in a geometry problem needs a reason: angles on a straight line = 180°, around a point = 360°, triangle = 180°, alternate angles equal, isosceles base angles equal, vertically opposite angles equal.", "terms": ["cyclic quadrilateral 圆内接四边形", "segment 弓形", "vertically opposite 对顶角", "reason 理由"], "ex": "圆内接四边形一角 87°，对角 = 93°", "yt": "corbettmaths circle theorems cyclic quadrilateral same segment", "bili": "圆内接四边形 对角互补 同弧圆周角", "qs": [{"t": "计算题 Calculation", "qz": "圆内接四边形 ABCD 中 ∠A = 108°，求 ∠C。", "qe": "Cyclic quadrilateral ABCD: ∠A = 108°. Find ∠C.", "a": "72°"}, {"t": "判断题 True/False", "qz": "同弧所对的圆周角相等。", "qe": "Angles subtended by the same arc at the circumference are equal.", "a": "正确 True"}, {"t": "选择题 MCQ", "qz": "“对顶角相等”英文是？ A. Alternate angles are equal B. Vertically opposite angles are equal", "qe": "'对顶角相等' in English? A. Alternate angles are equal B. Vertically opposite angles are equal", "a": "B"}, {"t": "计算题 Calculation", "qz": "OA、OB 为半径，∠OAB = 40°，求 ∠AOB 并说明理由。", "qe": "OA, OB radii, ∠OAB = 40°. Find ∠AOB with a reason.", "a": "100°（等腰三角形底角相等 isosceles triangle）"}]}]}, {"id": "u2h", "unit": "第2单元 Unit 2", "zh": "数据处理 1", "en": "Handling Data 1", "page": 150, "kps": [{"id": "u2h1", "zh": "统计调查与数据类型", "en": "Statistical investigation & types of data", "page": 150, "ez": "统计调查步骤：提出问题 → 收集数据 → 整理与展示 → 分析 → 得出结论。离散数据是数出来的（如人数）；连续数据是测量出来的（如身高、时间）；分类数据既不能数也不能测（如颜色、品牌）。用计数表（tally，每五笔一组，第五笔斜划）收集数据。", "ee": "Investigation cycle: pose a question → collect data → organise & present → analyse → conclude. Discrete data is counted; continuous data is measured; categorical data cannot be counted or measured. Use a tally chart (the fifth mark goes diagonally through four).", "terms": ["discrete 离散", "continuous 连续", "categorical 分类", "tally chart 计数表", "frequency 频数", "questionnaire 问卷"], "ex": "眼睛颜色 → 分类；家中孩子数 → 离散；到校距离 → 连续", "yt": "corbettmaths types of data discrete continuous", "bili": "数据类型 离散 连续 分类", "qs": [{"t": "选择题 MCQ", "qz": "“电池寿命（小时）”是？ A. 离散 B. 连续 C. 分类", "qe": "'Battery life in hours' is: A. discrete B. continuous C. categorical", "a": "B. 连续"}, {"t": "选择题 MCQ", "qz": "“宠物偏好”是？ A. 离散 B. 连续 C. 分类", "qe": "'Pet preference' is: A. discrete B. continuous C. categorical", "a": "C. 分类"}, {"t": "填空题 Fill in", "qz": "计数 |||| |||| ||| 表示频数 ____。", "qe": "Tally |||| |||| ||| (two gates + 3) means frequency ____.", "a": "13"}, {"t": "判断题 True/False", "qz": "看过的电视节目数量是连续数据。", "qe": "Number of TV programmes watched is continuous.", "a": "错误 False（离散 discrete）"}]}, {"id": "u2h2", "zh": "数据展示：象形图、饼图、条形图、双向表", "en": "Presenting data: pictograms, pie charts, bar charts, two-way tables", "page": 154, "ez": "象形图用图标表示频数（需图例）。饼图：扇形角 = 频数/总数 × 360°。条形图：条宽相同、条间留空（分类/离散数据），比较条形图把两组数据并排。双向表按两个分类整理数据，行列总数要一致。", "ee": "Pictograms use symbols with a key. Pie chart: angle = frequency/total × 360°. Bar charts: equal widths with gaps (categorical/discrete); comparative bar charts put two data sets side by side. Two-way tables organise data by two categories; row and column totals must agree.", "terms": ["pictogram 象形图", "pie chart 饼图", "sector 扇形", "bar chart 条形图", "two-way table 双向表", "comparative 比较"], "ex": "30 名学生中 12 人选数学：扇形角 = 12/30 × 360° = 144°", "yt": "corbettmaths pie charts drawing", "bili": "饼图 条形图 双向表", "qs": [{"t": "计算题 Calculation", "qz": "60 人中 15 人步行，饼图扇形角？", "qe": "15 of 60 people walk. Pie chart angle?", "a": "90°"}, {"t": "计算题 Calculation", "qz": "饼图扇形 72° 代表 18 人，总人数？", "qe": "A 72° sector represents 18 people. Total?", "a": "18 × 360/72 = 90"}, {"t": "应用题 Word problem", "qz": "双向表：男生 14 人，其中 6 人戴眼镜；全班 30 人，共 11 人戴眼镜。女生不戴眼镜几人？", "qe": "Two-way table: 14 boys (6 wear glasses), 30 pupils, 11 wear glasses. How many girls don't?", "a": "女生 16，戴眼镜女生 5，不戴 11"}, {"t": "判断题 True/False", "qz": "象形图必须有图例（key）。", "qe": "A pictogram must have a key.", "a": "正确 True"}]}, {"id": "u2h3", "zh": "误导性的数据展示", "en": "Misleading data presentation", "page": 159, "ez": "图表可能误导读者：纵轴不从 0 开始、刻度不均匀、立体图形放大面积、没有标签或标题、饼图比例不对等。看图时要检查坐标轴、刻度和数据来源。", "ee": "Graphs can mislead: vertical axis not starting at 0, uneven scales, 3-D pictures exaggerating size, missing labels/titles, wrong pie proportions. Always check axes, scales and sources.", "terms": ["misleading 误导", "scale 刻度", "axis 轴", "label 标签"], "ex": "纵轴从 95 开始，使 96 和 98 看起来相差三倍", "yt": "misleading graphs statistics", "bili": "误导性统计图", "qs": [{"t": "判断题 True/False", "qz": "纵轴不从 0 开始可能夸大差异。", "qe": "A vertical axis not starting at 0 can exaggerate differences.", "a": "正确 True"}, {"t": "选择题 MCQ", "qz": "下列哪项不会造成误导？ A. 刻度不均匀 B. 有清晰标题与标签 C. 立体放大图标", "qe": "Which does NOT mislead? A. uneven scale B. clear title and labels C. enlarged 3-D icons", "a": "B"}, {"t": "应用题 Word problem", "qz": "一则广告图把高度翻倍的图标画成长宽都翻倍。实际看上去放大了几倍？", "qe": "An advert doubles an icon's height AND width. How much bigger does it look (area)?", "a": "4 倍面积 4×"}, {"t": "填空题 Fill in", "qz": "检查统计图时要看 ____、____ 和数据来源。", "qe": "When checking a chart look at the ____, ____ and data source.", "a": "坐标轴 axes、刻度 scale"}]}, {"id": "u2h4", "zh": "离散数据的平均数", "en": "Averages for discrete data", "page": 161, "ez": "平均数 mean = 总和 ÷ 个数；中位数 median = 按顺序排列后中间的值（偶数个时取中间两数平均）；众数 mode = 出现次数最多的值（可能没有或有多个，可用于分类数据）。极差 = 最大 − 最小。会选择合适的平均数：极端值会影响平均数。", "ee": "Mean = total ÷ number of values; median = middle value in order (mean of middle two for an even count); mode = most frequent value (may be none or several; works for categorical data). Range = highest − lowest. Choose the right average: extreme values affect the mean.", "terms": ["mean 平均数", "median 中位数", "mode 众数", "range 极差", "outlier 极端值"], "ex": "9, 10, 12, 15, 15, 17：平均 13，中位 13.5，众数 15", "yt": "corbettmaths mean median mode range", "bili": "平均数 中位数 众数", "qs": [{"t": "计算题 Calculation", "qz": "求 4, 7, 7, 9, 13 的平均数、中位数、众数。", "qe": "Mean, median, mode of 4, 7, 7, 9, 13.", "a": "8，7，7"}, {"t": "计算题 Calculation", "qz": "5 个数平均为 12，加入第 6 个数后平均为 13，第 6 个数？", "qe": "5 numbers have mean 12; with a 6th the mean is 13. The 6th?", "a": "78 − 60 = 18"}, {"t": "选择题 MCQ", "qz": "收入数据中有一位亿万富翁，最适合的平均数是？ A. 平均数 B. 中位数", "qe": "Incomes include one billionaire. Best average? A. mean B. median", "a": "B. 中位数"}, {"t": "判断题 True/False", "qz": "众数可以用于分类数据。", "qe": "The mode can be used for categorical data.", "a": "正确 True"}]}]}, {"id": "u3n", "unit": "第3单元 Unit 3", "zh": "数 3", "en": "Number 3", "page": 175, "kps": [{"id": "u3n1", "zh": "质因数分解", "en": "Prime factors", "page": 175, "ez": "质数只有 1 和自身两个因数（1 不是质数）。用质数反复除（因数树或短除）求质因数，结果写成指数形式。每个数的质因数分解是唯一的。", "ee": "A prime has exactly two factors (1 is not prime). Divide repeatedly by primes (factor tree or repeated division) and write the product of prime factors in index form. There is only one way to express a number as a product of primes.", "terms": ["prime 质数", "factor 因数", "multiple 倍数", "factor tree 因数树", "index form 指数形式"], "ex": "252 = 2² × 3² × 7", "yt": "corbettmaths prime factor decomposition", "bili": "分解质因数 因数树", "qs": [{"t": "计算题 Calculation", "qz": "把 28 分解质因数。", "qe": "Write 28 as a product of prime factors.", "a": "2² × 7"}, {"t": "填空题 Fill in", "qz": "48 = 2ⁿ × 3，n = ____", "qe": "48 = 2ⁿ × 3, n = ____", "a": "4"}, {"t": "计算题 Calculation", "qz": "6 × 252 的质因数分解？", "qe": "Prime factors of 6 × 252?", "a": "2³ × 3³ × 7"}, {"t": "判断题 True/False", "qz": "1 是质数。", "qe": "1 is a prime number.", "a": "错误 False"}]}, {"id": "u3n2", "zh": "最大公因数与最小公倍数", "en": "HCF & LCM", "page": 177, "ez": "最大公因数 HCF 是几个数共有的最大因数；最小公倍数 LCM 是共有的最小倍数。方法：把各数质因数分解，放进韦恩图——交集部分之积为 HCF，全部之积为 LCM。", "ee": "The HCF is the highest factor common to a set of numbers; the LCM is the lowest common multiple. Write each number in prime factors and use a Venn diagram: product of the intersection = HCF, product of everything = LCM.", "terms": ["HCF 最大公因数", "LCM 最小公倍数", "Venn diagram 韦恩图"], "ex": "24 = 2³×3，36 = 2²×3²：HCF = 2²×3 = 12，LCM = 2³×3² = 72", "yt": "corbettmaths HCF LCM venn diagram", "bili": "最大公因数 最小公倍数 韦恩图", "qs": [{"t": "计算题 Calculation", "qz": "求 20 和 35 的 HCF。", "qe": "HCF of 20 and 35.", "a": "5"}, {"t": "计算题 Calculation", "qz": "求 6 和 15 的 LCM。", "qe": "LCM of 6 and 15.", "a": "30"}, {"t": "应用题 Word problem", "qz": "18 颗巧克力和 27 颗薄荷糖平均装袋（每袋相同、不剩），最多装几袋？", "qe": "18 chocolates and 27 mints in identical bags, none left over. Max bags?", "a": "HCF = 9 袋"}, {"t": "应用题 Word problem", "qz": "两盏灯分别每 12 秒、18 秒闪一次，同时闪后多少秒再同时闪？", "qe": "Lights flash every 12 s and 18 s. After flashing together, when next together?", "a": "LCM = 36 秒"}]}, {"id": "u3n3", "zh": "比", "en": "Ratio", "page": 180, "ez": "按比分配：把比的各部分相加得总份数，每份 = 总量 ÷ 总份数。比的两边同乘或同除一个数，比值不变（化简比）。比较比可化为单位比 1 : n 或 n : 1。", "ee": "To share in a ratio, add the parts to find the total number of shares, then divide. Ratios stay the same if both sides are multiplied or divided by the same number. Compare ratios by writing them as unit ratios (1 : n).", "terms": ["ratio 比", "proportion 比例", "unit ratio 单位比", "share 分配"], "ex": "$120 按 3 : 5 分：每份 15，得 $45 和 $75", "yt": "corbettmaths sharing in a ratio", "bili": "按比例分配 化简比", "qs": [{"t": "计算题 Calculation", "qz": "把 $120 按 3 : 5 分配。", "qe": "Divide $120 in the ratio 3 : 5.", "a": "$45，$75"}, {"t": "计算题 Calculation", "qz": "三角形三角之比 1 : 2 : 3，求三角。", "qe": "Triangle angles in ratio 1 : 2 : 3. Find them.", "a": "30°, 60°, 90°"}, {"t": "应用题 Word problem", "qz": "$100 按 7 : 8 : 10 分给三姐妹，Lien（8）得多少？", "qe": "$100 shared 7 : 8 : 10. How much does Lien (8) get?", "a": "$32"}, {"t": "计算题 Calculation", "qz": "52 名教师、598 名学生，写成 1 : n。", "qe": "52 teachers, 598 students: write as 1 : n.", "a": "1 : 11.5"}]}]}, {"id": "u3a", "unit": "第3单元 Unit 3", "zh": "代数 3", "en": "Algebra 3", "page": 185, "kps": [{"id": "u3a1", "zh": "提公因式（简单因式分解）", "en": "Simple factorising", "page": 185, "ez": "因式分解是展开括号的逆过程。找出各项的最大公因式（数字和字母）提到括号外：6x + 9 = 3(2x + 3)；4x² − 6xy = 2x(2x − 3y)。展开检查。", "ee": "Factorising is the reverse of expanding brackets. Take out the highest common factor (numbers and letters): 6x + 9 = 3(2x + 3); 4x² − 6xy = 2x(2x − 3y). Check by expanding.", "terms": ["factorise 因式分解", "common factor 公因式", "fully 完全"], "ex": "15a²b − 10ab² = 5ab(3a − 2b)", "yt": "corbettmaths factorising", "bili": "提公因式 因式分解", "qs": [{"t": "计算题 Calculation", "qz": "因式分解 12x − 18。", "qe": "Factorise 12x − 18.", "a": "6(2x − 3)"}, {"t": "计算题 Calculation", "qz": "完全因式分解 8a²b + 12ab。", "qe": "Factorise fully 8a²b + 12ab.", "a": "4ab(2a + 3)"}, {"t": "计算题 Calculation", "qz": "因式分解 x³ − x²。", "qe": "Factorise x³ − x².", "a": "x²(x − 1)"}, {"t": "判断题 True/False", "qz": "2(4x + 6) 已是完全因式分解。", "qe": "2(4x + 6) is fully factorised.", "a": "错误 False，应为 4(2x + 3)"}]}, {"id": "u3a2", "zh": "用因式分解化简分式", "en": "Simplifying fractions by factorising", "page": 186, "ez": "化简代数分式前先因式分解分子和分母，再约去公共因式（整个括号也可以约）。", "ee": "Before simplifying an algebraic fraction, factorise numerator and denominator, then cancel common factors (a whole bracket can be cancelled).", "terms": ["cancel 约分", "factor 因式"], "ex": "(3x + 6)/(x + 2) = 3(x + 2)/(x + 2) = 3", "yt": "simplifying algebraic fractions factorising", "bili": "分式约分 因式分解", "qs": [{"t": "计算题 Calculation", "qz": "化简 (4x − 8)/4。", "qe": "Simplify (4x − 8)/4.", "a": "x − 2"}, {"t": "计算题 Calculation", "qz": "化简 (x² + 5x)/x。", "qe": "Simplify (x² + 5x)/x.", "a": "x + 5"}, {"t": "计算题 Calculation", "qz": "化简 (6a + 9)/(4a + 6)。", "qe": "Simplify (6a + 9)/(4a + 6).", "a": "3(2a + 3)/2(2a + 3) = 3/2"}, {"t": "判断题 True/False", "qz": "(x + 4)/(x + 2) = 2。", "qe": "(x + 4)/(x + 2) = 2.", "a": "错误 False"}]}, {"id": "u3a3", "zh": "含分数的方程", "en": "Equations with fractions", "page": 187, "ez": "两边同乘以所有分母的最小公倍数，去掉分母后再解。分子是多项式时要加括号。未知数在分母时，两边乘以含未知数的分母。", "ee": "Multiply both sides by the LCM of the denominators to clear the fractions, then solve. Put brackets around numerators with more than one term. If x is in the denominator, multiply both sides by it.", "terms": ["denominator 分母", "LCM 最小公倍数", "clear fractions 去分母"], "ex": "x/3 + x/4 = 7 ⇒ 4x + 3x = 84 ⇒ x = 12", "yt": "corbettmaths solving equations with fractions", "bili": "解分式方程 去分母", "qs": [{"t": "计算题 Calculation", "qz": "解 x/5 = 3。", "qe": "Solve x/5 = 3.", "a": "x = 15"}, {"t": "计算题 Calculation", "qz": "解 (x + 1)/2 − (x − 1)/3 = 2。", "qe": "Solve (x + 1)/2 − (x − 1)/3 = 2.", "a": "3x + 3 − 2x + 2 = 12 ⇒ x = 7"}, {"t": "计算题 Calculation", "qz": "解 12/x = 4。", "qe": "Solve 12/x = 4.", "a": "x = 3"}, {"t": "计算题 Calculation", "qz": "解 2x/3 − 1 = 5。", "qe": "Solve 2x/3 − 1 = 5.", "a": "x = 9"}]}, {"id": "u3a4", "zh": "联立方程：代入法", "en": "Simultaneous equations: substitution", "page": 190, "ez": "把其中一个方程变形为“一个未知数 = …”，代入另一个方程，解出一个未知数，再代回求另一个。适用于某个方程已写成 y = … 的情况。", "ee": "Rearrange one equation to make one variable the subject, substitute into the other equation, solve, then substitute back to find the other variable. Useful when one equation is already y = ….", "terms": ["substitution 代入法", "variable 未知数/变量"], "ex": "y = 2x − 1，3x + y = 9 ⇒ 3x + 2x − 1 = 9 ⇒ x = 2，y = 3", "yt": "corbettmaths simultaneous equations substitution", "bili": "代入消元法 二元一次方程组", "qs": [{"t": "计算题 Calculation", "qz": "解 y = x + 3，2x + y = 12。", "qe": "Solve y = x + 3, 2x + y = 12.", "a": "x = 3，y = 6"}, {"t": "计算题 Calculation", "qz": "解 x = 2y，x + y = 9。", "qe": "Solve x = 2y, x + y = 9.", "a": "y = 3，x = 6"}, {"t": "计算题 Calculation", "qz": "解 y = 3x − 5，y = x + 1。", "qe": "Solve y = 3x − 5, y = x + 1.", "a": "x = 3，y = 4"}, {"t": "判断题 True/False", "qz": "代入后必须把结果代回原方程检验。", "qe": "After solving you should check in the original equations.", "a": "正确 True"}]}, {"id": "u3a5", "zh": "联立方程：消元法", "en": "Simultaneous equations: elimination", "page": 191, "ez": "给方程编号 (1)(2)；选择要消去的未知数；必要时两方程乘以适当的数使该未知数系数相同（符号相反则相加，相同则相减）；消元后解方程；代回求另一个；用另一个原方程检验。", "ee": "Label equations (1) and (2); choose which variable to eliminate; multiply one or both so the coefficients match (add if opposite signs, subtract if same); solve; substitute back; check in the other original equation.", "terms": ["elimination 消元法", "coefficient 系数"], "ex": "3x + y = 11，x + y = 7：相减 2x = 4 ⇒ x = 2，y = 5", "yt": "corbettmaths simultaneous equations elimination", "bili": "加减消元法", "qs": [{"t": "计算题 Calculation", "qz": "解 3x + y = 11，x + y = 7。", "qe": "Solve 3x + y = 11, x + y = 7.", "a": "x = 2，y = 5"}, {"t": "计算题 Calculation", "qz": "解 2x + y = 5，3x − 2y = −3。", "qe": "Solve 2x + y = 5, 3x − 2y = −3.", "a": "x = 1，y = 3"}, {"t": "计算题 Calculation", "qz": "解 2x + 5y = 9，3x + 4y = 10。", "qe": "Solve 2x + 5y = 9, 3x + 4y = 10.", "a": "x = 2，y = 1"}, {"t": "选择题 MCQ", "qz": "消去 y：x + 2y = 8 和 3x − 2y = 4 应该？ A. 相加 B. 相减", "qe": "To eliminate y from x + 2y = 8 and 3x − 2y = 4: A. add B. subtract", "a": "A. 相加 add（x = 3，y = 2.5）"}]}, {"id": "u3a6", "zh": "联立方程应用题", "en": "Problems leading to simultaneous equations", "page": 195, "ez": "设定变量（写清楚代表什么）；把题目每句话写成方程；选择代入法或消元法求解；回答原问题并检验是否合理。", "ee": "Define your variables; write an equation for each sentence; solve by substitution or elimination; answer the question in context and check it is sensible.", "terms": ["define variables 设未知数", "form equations 列方程"], "ex": "两数和 112，差 54：x + y = 112，x − y = 54 ⇒ 83 和 29", "yt": "corbettmaths simultaneous equations word problems", "bili": "二元一次方程组 应用题", "qs": [{"t": "应用题 Word problem", "qz": "两数平均数为 14，差为 4，求两数。", "qe": "Two numbers have mean 14 and difference 4. Find them.", "a": "16 和 12"}, {"t": "应用题 Word problem", "qz": "一个数的 2 倍加另一个数的 4 倍为 34，两数和为 13。求两数。", "qe": "Twice one number plus four times another is 34; their sum is 13. Find them.", "a": "x = 9，y = 4"}, {"t": "应用题 Word problem", "qz": "2 个汉堡 + 3 杯可乐 £3.45；1 个汉堡 + 2 杯可乐 £2.00。各多少钱？", "qe": "2 burgers + 3 colas = £3.45; 1 burger + 2 colas = £2.00. Prices?", "a": "可乐 £0.55，汉堡 £0.90"}, {"t": "应用题 Word problem", "qz": "成人票 $8，儿童票 $5，共卖 40 张收入 $260，各几张？", "qe": "Adult $8, child $5; 40 tickets for $260. How many of each?", "a": "成人 20，儿童 20"}]}]}, {"id": "u3g", "unit": "第3单元 Unit 3", "zh": "图像 3", "en": "Graphs 3", "page": 201, "kps": [{"id": "u3g1", "zh": "距离–时间图", "en": "Distance–time graphs", "page": 202, "ez": "纵轴是离出发点的距离，横轴是时间。水平线表示静止；斜率表示速度（直线 = 匀速）；正斜率为去程，负斜率为返程。平均速度 = 总距离 ÷ 总时间。", "ee": "Vertical axis: distance from the start; horizontal axis: time. A horizontal line means no movement; the gradient gives the speed (straight line = constant speed); positive gradient = outward journey, negative = return. Average speed = total distance ÷ total time.", "terms": ["distance–time graph 距离时间图", "speed 速度", "stationary 静止", "average speed 平均速度"], "ex": "2 小时行 50 km：速度 = 25 km/h", "yt": "corbettmaths distance time graphs", "bili": "路程时间图像 速度", "qs": [{"t": "计算题 Calculation", "qz": "图上一段从 (1 h, 20 km) 到 (3 h, 110 km)，速度？", "qe": "A segment from (1 h, 20 km) to (3 h, 110 km). Speed?", "a": "45 km/h"}, {"t": "判断题 True/False", "qz": "距离–时间图中水平线表示匀速运动。", "qe": "A horizontal line on a distance–time graph means constant speed.", "a": "错误 False（静止 stationary）"}, {"t": "应用题 Word problem", "qz": "去程 90 km 用 2 h，休息 1 h，返程用 3 h。全程平均速度？", "qe": "90 km out in 2 h, rest 1 h, return in 3 h. Average speed overall?", "a": "180 ÷ 6 = 30 km/h"}, {"t": "计算题 Calculation", "qz": "把 72 km/h 换成 m/s。", "qe": "Convert 72 km/h to m/s.", "a": "20 m/s"}]}, {"id": "u3g2", "zh": "速度–时间图", "en": "Speed–time graphs", "page": 205, "ez": "速度–时间图的斜率是加速度（负斜率为减速/retardation）；图像下方面积是行驶的距离（常拆成三角形、长方形、梯形）。单位：加速度 m/s² 或 km/h²。", "ee": "On a speed–time graph the gradient is the acceleration (negative = retardation); the area under the graph is the distance travelled (split into triangles, rectangles, trapezia). Units: m/s² or km/h².", "terms": ["acceleration 加速度", "retardation / deceleration 减速度", "area under graph 图下面积"], "ex": "0→20 m/s 用 10 s：加速度 2 m/s²；面积 ½ × 10 × 20 = 100 m", "yt": "corbettmaths speed time graphs", "bili": "速度时间图像 加速度 面积 路程", "qs": [{"t": "计算题 Calculation", "qz": "0 到 40 s 速度从 0 匀加速到 20 m/s，加速度？", "qe": "Speed rises uniformly 0 → 20 m/s in 40 s. Acceleration?", "a": "0.5 m/s²"}, {"t": "计算题 Calculation", "qz": "上题这 40 s 内行驶距离？", "qe": "Distance in those 40 s?", "a": "½ × 40 × 20 = 400 m"}, {"t": "判断题 True/False", "qz": "速度–时间图下的面积表示距离。", "qe": "The area under a speed–time graph is the distance.", "a": "正确 True"}, {"t": "计算题 Calculation", "qz": "火车 20 m/s 在最后 80 s 匀减速到停，减速度？", "qe": "A train slows uniformly from 20 m/s to rest in 80 s. Retardation?", "a": "0.25 m/s²"}]}]}, {"id": "u3s", "unit": "第3单元 Unit 3", "zh": "形与空间 3", "en": "Shape and Space 3", "page": 213, "kps": [{"id": "u3s1", "zh": "正切比", "en": "The tangent ratio", "page": 214, "ez": "直角三角形中，相对于角 θ：对边 opposite、邻边 adjacent、斜边 hypotenuse。tan θ = 对边 / 邻边（TOA）。相似直角三角形中同一角的 tan 值相同。特殊值：tan 45° = 1，tan 30° = 1/√3，tan 60° = √3。", "ee": "In a right-angled triangle relative to angle θ: opposite, adjacent, hypotenuse. tan θ = opposite / adjacent (TOA). It is the same for all similar right-angled triangles. tan 45° = 1, tan 30° = 1/√3, tan 60° = √3.", "terms": ["tangent 正切", "opposite 对边", "adjacent 邻边", "hypotenuse 斜边", "angle of elevation 仰角"], "ex": "对边 3、邻边 4：tan θ = 0.75", "yt": "corbettmaths tangent ratio trigonometry", "bili": "正切 tan 三角函数", "qs": [{"t": "填空题 Fill in", "qz": "tan θ = ____ / ____", "qe": "tan θ = ____ / ____", "a": "对边 opposite / 邻边 adjacent"}, {"t": "判断题 True/False", "qz": "tan 45° = 1。", "qe": "tan 45° = 1.", "a": "正确 True"}, {"t": "计算题 Calculation", "qz": "对边 5，邻边 12，tan θ = ?", "qe": "Opposite 5, adjacent 12. tan θ = ?", "a": "5/12 ≈ 0.417"}, {"t": "选择题 MCQ", "qz": "斜边是： A. 最短边 B. 直角的对边 C. θ 的邻边", "qe": "The hypotenuse is: A. shortest side B. opposite the right angle C. adjacent to θ", "a": "B"}]}, {"id": "u3s2", "zh": "用正切求边", "en": "Using tan to calculate sides", "page": 215, "ez": "已知一个角和邻边求对边：opp = adj × tan θ；已知对边求邻边：adj = opp ÷ tan θ。计算器要设为度（DEG），答案保留 3 位有效数字。", "ee": "Given an angle and the adjacent side: opp = adj × tan θ. Given the opposite side: adj = opp ÷ tan θ. Use degree mode and give answers to 3 s.f.", "terms": ["degree mode 角度模式", "3 s.f. 三位有效数字"], "ex": "离树 50 m 处仰角 30°：高 = 50 tan 30° ≈ 28.9 m", "yt": "corbettmaths trigonometry missing sides tan", "bili": "正切 求边长", "qs": [{"t": "计算题 Calculation", "qz": "邻边 10 cm，θ = 35°，求对边。", "qe": "Adjacent 10 cm, θ = 35°. Find the opposite.", "a": "10 tan 35° ≈ 7.00 cm"}, {"t": "计算题 Calculation", "qz": "对边 8 m，θ = 25°，求邻边。", "qe": "Opposite 8 m, θ = 25°. Find the adjacent.", "a": "8 ÷ tan 25° ≈ 17.2 m"}, {"t": "应用题 Word problem", "qz": "距塔底 40 m 处测塔顶仰角 52°，塔高？", "qe": "From 40 m away the angle of elevation of a tower's top is 52°. Height?", "a": "40 tan 52° ≈ 51.2 m"}, {"t": "判断题 True/False", "qz": "计算器在弧度模式下也能得到正确答案。", "qe": "Radian mode gives the correct answer here.", "a": "错误 False"}]}, {"id": "u3s3", "zh": "用正切求角", "en": "Using tan to calculate angles", "page": 218, "ez": "已知对边和邻边求角：θ = tan⁻¹(opp/adj)，按计算器 SHIFT tan。角的答案通常保留 1 位小数或 3 位有效数字。", "ee": "Given opposite and adjacent, θ = tan⁻¹(opp/adj) using SHIFT tan on the calculator. Give angles to 1 d.p. or 3 s.f.", "terms": ["inverse tan 反正切", "tan⁻¹"], "ex": "opp 4、adj 3：θ = tan⁻¹(4/3) ≈ 53.1°", "yt": "corbettmaths trigonometry missing angles", "bili": "反三角函数 求角度 tan", "qs": [{"t": "计算题 Calculation", "qz": "opp = 15，adj = 15，θ = ?", "qe": "opp = 15, adj = 15. θ = ?", "a": "45°"}, {"t": "计算题 Calculation", "qz": "opp = 9，adj = 12，θ = ?", "qe": "opp = 9, adj = 12. θ = ?", "a": "tan⁻¹(0.75) ≈ 36.9°"}, {"t": "应用题 Word problem", "qz": "斜坡水平 20 m 上升 3 m，坡角？", "qe": "A ramp rises 3 m over 20 m horizontally. Angle?", "a": "tan⁻¹(0.15) ≈ 8.53°"}, {"t": "判断题 True/False", "qz": "tan⁻¹ 求出的是角度。", "qe": "tan⁻¹ gives an angle.", "a": "正确 True"}]}]}, {"id": "u3h", "unit": "第3单元 Unit 3", "zh": "数据处理 2", "en": "Handling Data 2", "page": 224, "kps": [{"id": "u3h1", "zh": "频数表", "en": "Frequency tables", "page": 225, "ez": "频数表把数据按值或组整理。总频数 Σf = 数据个数。从频数表可直接找众数（频数最大的值）和中位数位置（第 (n+1)/2 个）。", "ee": "Frequency tables organise data by value or group. Total frequency Σf = number of data. The mode is the value with highest frequency; the median is the (n + 1)/2-th value.", "terms": ["frequency table 频数表", "Σ 求和", "cumulative 累计"], "ex": "得分 1,2,3 频数 4,6,5：n = 15，中位数第 8 个 = 2", "yt": "corbettmaths frequency tables", "bili": "频数分布表", "qs": [{"t": "计算题 Calculation", "qz": "值 0,1,2,3 频数 3,7,6,4。众数？", "qe": "Values 0,1,2,3 with frequencies 3,7,6,4. Mode?", "a": "1"}, {"t": "计算题 Calculation", "qz": "上题中位数？", "qe": "Median of the same data?", "a": "n = 20，第 10、11 个都是 2 ⇒ 2"}, {"t": "填空题 Fill in", "qz": "总频数用符号 ____ 表示。", "qe": "Total frequency is written ____.", "a": "Σf"}, {"t": "判断题 True/False", "qz": "众数是频数本身最大的数。", "qe": "The mode is the largest frequency number itself.", "a": "错误 False（是对应的值 the value）"}]}, {"id": "u3h2", "zh": "离散数据的频数表计算", "en": "Discrete data from frequency tables", "page": 225, "ez": "离散频数表的平均数 = Σ(f × x) ÷ Σf。加一列 f × x 求总和。也可读出极差、众数和中位数，并画条形图（竖线图）。", "ee": "For a discrete frequency table, mean = Σ(f × x) ÷ Σf. Add an f × x column. You can also find the range, mode and median, and draw a bar (vertical line) chart.", "terms": ["fx 频数×值", "mean from frequency table 频数表平均数"], "ex": "x = 1,2,3，f = 2,5,3：Σfx = 2 + 10 + 9 = 21，平均 = 2.1", "yt": "corbettmaths mean from a frequency table", "bili": "频数表求平均数", "qs": [{"t": "计算题 Calculation", "qz": "x = 0,1,2,3；f = 5,8,4,3。求平均数。", "qe": "x = 0,1,2,3; f = 5,8,4,3. Find the mean.", "a": "(0+8+8+9)/20 = 1.25"}, {"t": "计算题 Calculation", "qz": "家庭孩子数 1,2,3,4 的频数 6,9,3,2。平均？", "qe": "Children per family 1,2,3,4 with f = 6,9,3,2. Mean?", "a": "(6+18+9+8)/20 = 2.05"}, {"t": "判断题 True/False", "qz": "平均数 = Σfx ÷ Σx。", "qe": "Mean = Σfx ÷ Σx.", "a": "错误 False（÷ Σf）"}, {"t": "计算题 Calculation", "qz": "上一题的极差？", "qe": "Range of the children data?", "a": "4 − 1 = 3"}]}, {"id": "u3h3", "zh": "连续（分组）数据与频数多边形", "en": "Continuous (grouped) data & frequency polygons", "page": 226, "ez": "连续数据分组（如 0 ≤ h < 0.5）。估计平均数：用组中值 x，平均 ≈ Σfx ÷ Σf（因为不知道原始值，所以是估计）。可写出众数所在组、中位数所在组。频数多边形：在组中值处描点 (x, f) 并用直线连接。", "ee": "Continuous data is grouped (e.g. 0 ≤ h < 0.5). Estimated mean = Σfx ÷ Σf using mid-points x (an estimate because the exact values are unknown). State the modal class and the class containing the median. Frequency polygon: plot (mid-point, frequency) and join with straight lines.", "terms": ["class interval 组距", "mid-point 组中值", "modal class 众数组", "frequency polygon 频数多边形", "estimate 估计"], "ex": "0–0.5 (f3, 中值0.25)，0.5–1 (f5, 0.75)… 用 Σfx/Σf", "yt": "corbettmaths estimated mean grouped data", "bili": "分组数据 估计平均数 组中值", "qs": [{"t": "计算题 Calculation", "qz": "组 0–10、10–20、20–30 的频数 4、10、6，估计平均。", "qe": "Groups 0–10, 10–20, 20–30 with f = 4, 10, 6. Estimate the mean.", "a": "(20 + 150 + 150)/20 = 16"}, {"t": "填空题 Fill in", "qz": "上题众数组是 ____。", "qe": "The modal class above is ____.", "a": "10–20"}, {"t": "判断题 True/False", "qz": "分组数据求出的平均数是精确值。", "qe": "The mean from grouped data is exact.", "a": "错误 False（估计值）"}, {"t": "选择题 MCQ", "qz": "频数多边形的点画在： A. 组的上限 B. 组中值 C. 组的下限", "qe": "Frequency polygon points are plotted at: A. upper bound B. mid-point C. lower bound", "a": "B"}]}]}, {"id": "u4n", "unit": "第4单元 Unit 4", "zh": "数 4", "en": "Number 4", "page": 237, "kps": [{"id": "u4n1", "zh": "复合百分比（复利、连续增减）", "en": "Compound percentages", "page": 238, "ez": "每年增加 R%，n 年后：乘以 (1 + R/100)ⁿ；每年减少 R%：乘以 (1 − R/100)ⁿ。用于复利、人口增长、折旧、冷却等。注意与单利（每年按原值计算）区分。", "ee": "To increase by R% per annum for n years multiply by (1 + R/100)ⁿ; to decrease, multiply by (1 − R/100)ⁿ. Used for compound interest, population growth, depreciation, cooling. Contrast with simple interest (always on the original amount).", "terms": ["compound interest 复利", "per annum (p.a.) 每年", "depreciation 折旧", "simple interest 单利"], "ex": "100°C 的咖啡每分钟降 12%：10 分钟后 100 × 0.88¹⁰ ≈ 27.9°C", "yt": "corbettmaths compound interest", "bili": "复利 复合百分比 增长", "qs": [{"t": "计算题 Calculation", "qz": "€5000 年利率 4% 复利 3 年，本息？", "qe": "€5000 at 4% compound interest for 3 years. Final amount?", "a": "5000 × 1.04³ = €5624.32"}, {"t": "计算题 Calculation", "qz": "汽车 $20 000 每年贬值 15%，5 年后价值？", "qe": "A $20 000 car depreciates 15% p.a. Value after 5 years?", "a": "20 000 × 0.85⁵ ≈ $8874"}, {"t": "选择题 MCQ", "qz": "每年增长 15% 持续 5 年的乘数： A. 1.75 B. 1.15⁵ C. 5 × 1.15", "qe": "Multiplier for +15% p.a. for 5 years: A. 1.75 B. 1.15⁵ C. 5 × 1.15", "a": "B. 1.15⁵"}, {"t": "判断题 True/False", "qz": "单利和复利在第一年结束时金额相同。", "qe": "Simple and compound interest give the same amount after 1 year.", "a": "正确 True"}]}, {"id": "u4n2", "zh": "反向百分比（求原值）", "en": "Inverse percentages", "page": 241, "ez": "已知变化后的值求原值：原值 = 新值 ÷ 乘数。例如涨价 20% 后为 $96，原价 = 96 ÷ 1.2 = $80。不要直接减去 20%！", "ee": "To find the original value: original = new value ÷ multiplier. E.g. after a 20% increase the price is $96, so original = 96 ÷ 1.2 = $80. Do NOT just take 20% off the new value.", "terms": ["inverse percentage 反向百分比", "original value 原值", "VAT 增值税"], "ex": "打 7 折（−30%）后 £56：原价 = 56 ÷ 0.7 = £80", "yt": "corbettmaths reverse percentages", "bili": "反向百分比 求原价", "qs": [{"t": "计算题 Calculation", "qz": "含 20% 税的价格是 $150，税前价？", "qe": "Price including 20% tax is $150. Price before tax?", "a": "150 ÷ 1.2 = $125"}, {"t": "计算题 Calculation", "qz": "降价 15% 后为 €68，原价？", "qe": "After a 15% reduction the price is €68. Original?", "a": "68 ÷ 0.85 = €80"}, {"t": "应用题 Word problem", "qz": "人口增长 8% 后为 54 000，原来多少？", "qe": "After an 8% increase, population is 54 000. Original?", "a": "50 000"}, {"t": "判断题 True/False", "qz": "$96 是涨价 20% 后价格，原价 = 96 × 0.8。", "qe": "$96 after a 20% rise: original = 96 × 0.8.", "a": "错误 False（96 ÷ 1.2 = 80，而 96 × 0.8 = 76.8）"}]}]}, {"id": "u4a", "unit": "第4单元 Unit 4", "zh": "代数 4", "en": "Algebra 4", "page": 247, "kps": [{"id": "u4a1", "zh": "使用公式", "en": "Using formulae", "page": 247, "ez": "使用公式：写出已知量（带正确单位）→ 写出公式 → 代入 → 计算。常用公式：平行四边形面积 bh；梯形面积 ½h(a + b)；三角形面积 ½ × 底 × 高；速度 = 距离/时间；圆周长 2πr，面积 πr²。", "ee": "When using a formula: write the facts with units → write the formula → substitute → work it out. Common formulae: parallelogram bh; trapezium ½h(a + b); triangle ½ × base × height; speed = distance/time; circle circumference 2πr, area πr².", "terms": ["formula 公式", "substitute 代入", "trapezium 梯形", "circumference 周长"], "ex": "梯形 a = 5, b = 9, h = 4：面积 = ½ × 4 × 14 = 28", "yt": "corbettmaths substitution into formulae", "bili": "代入公式求值", "qs": [{"t": "计算题 Calculation", "qz": "平行四边形面积 31.5 cm²，底 7 cm，高？", "qe": "A parallelogram has area 31.5 cm² and base 7 cm. Height?", "a": "4.5 cm"}, {"t": "计算题 Calculation", "qz": "r = 5 cm 的圆面积（3 s.f.）。", "qe": "Area of a circle, r = 5 cm (3 s.f.).", "a": "78.5 cm²"}, {"t": "计算题 Calculation", "qz": "v = u + at，u = 3，a = 2，t = 5，v = ?", "qe": "v = u + at, u = 3, a = 2, t = 5. v = ?", "a": "13"}, {"t": "应用题 Word problem", "qz": "120 km 用时 1.5 h，速度？", "qe": "120 km in 1.5 h. Speed?", "a": "80 km/h"}]}, {"id": "u4a2", "zh": "变换公式主项", "en": "Change of subject", "page": 249, "ez": "把公式改写成以另一个字母为主项，方法与解方程相同：两边做相同运算。主项出现一次时逐步“剥离”；主项有平方时最后开方；主项出现两次时，先把含主项的项移到一边再提公因式。", "ee": "Rearranging a formula to make another letter the subject uses the same steps as solving an equation. If the subject occurs once, undo operations in reverse; if it is squared, square-root at the end; if it occurs twice, collect those terms on one side and factorise.", "terms": ["subject 主项", "rearrange 变形", "inverse operation 逆运算"], "ex": "v = u + at ⇒ t = (v − u)/a；  A = πr² ⇒ r = √(A/π)", "yt": "corbettmaths changing the subject of a formula", "bili": "公式变形 换主项", "qs": [{"t": "计算题 Calculation", "qz": "把 y = 3x + 2 改写为 x = …", "qe": "Make x the subject of y = 3x + 2.", "a": "x = (y − 2)/3"}, {"t": "计算题 Calculation", "qz": "把 V = ⅓a²h 改写为 a = …", "qe": "Make a the subject of V = ⅓a²h.", "a": "a = √(3V/h)"}, {"t": "计算题 Calculation", "qz": "把 ax + b = cx 改写为 x = …", "qe": "Make x the subject of ax + b = cx.", "a": "x = b/(c − a)"}, {"t": "计算题 Calculation", "qz": "把 P = 2(l + w) 改写为 w = …", "qe": "Make w the subject of P = 2(l + w).", "a": "w = P/2 − l"}]}, {"id": "u4a3", "zh": "进一步的公式", "en": "Further formulae", "page": 252, "ez": "使用公式时如有需要，先变形再代入。例如金字塔体积 V = ⅓a²h，已知 V 和 h 求 a：a = √(3V/h)。可以自己根据情境建立公式。", "ee": "When using a formula, rearrange it first if necessary. E.g. pyramid V = ⅓a²h; given V and h, a = √(3V/h). You can also derive formulae from a situation.", "terms": ["derive 推导", "volume 体积", "pyramid 棱锥"], "ex": "胡夫金字塔 a = 232, h = 147：V ≈ 2 640 000 m³；V = 853 000, h = 100 ⇒ a ≈ 160 m", "yt": "rearranging formulae gcse problems", "bili": "公式应用 体积 变形", "qs": [{"t": "计算题 Calculation", "qz": "V = ⅓a²h，V = 300，h = 9，求 a。", "qe": "V = ⅓a²h, V = 300, h = 9. Find a.", "a": "a = √100 = 10"}, {"t": "计算题 Calculation", "qz": "s = ½at²，s = 80，a = 10，求 t（t > 0）。", "qe": "s = ½at², s = 80, a = 10. Find t (t > 0).", "a": "t = 4"}, {"t": "应用题 Word problem", "qz": "出租车费 C = 3 + 1.5d（美元），付 $18 行驶多远？", "qe": "Taxi fare C = 3 + 1.5d ($). How far for $18?", "a": "d = 10 km"}, {"t": "判断题 True/False", "qz": "E = mc²，则 c = √(E/m)。", "qe": "E = mc² gives c = √(E/m).", "a": "正确 True"}]}]}, {"id": "u4g", "unit": "第4单元 Unit 4", "zh": "图像 4", "en": "Graphs 4", "page": 259, "kps": [{"id": "u4g1", "zh": "二次函数图像 y = ax² + bx + c", "en": "Quadratic graphs y = ax² + bx + c", "page": 259, "ez": "y = ax² + bx + c 的图像是抛物线。a > 0 开口向上（U 形），a < 0 开口向下（倒 U 形）。图像关于对称轴对称，有最低点或最高点（顶点）。描足够多的点（尤其拐弯处），用光滑曲线连接，不要连成折线。", "ee": "y = ax² + bx + c is a quadratic; its graph is a parabola. If a > 0 it is U-shaped; if a < 0 it is an inverted U. It has a line of symmetry and a turning point. Plot enough points (especially near the turn) and draw a smooth curve, not straight segments.", "terms": ["quadratic 二次", "parabola 抛物线", "turning point 顶点", "line of symmetry 对称轴", "smooth curve 光滑曲线"], "ex": "y = x² + 2x：x = −3
